<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0f1117"/>
<title>Family Tree</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0f1117;color:#e0e6f0;
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ── App shell ── */
#app{display:flex;flex-direction:column;height:100%;height:100dvh}

#header{flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;height:52px;background:#12151f;border-bottom:1px solid #1e2538;z-index:10}
.header-title{font-size:18px;font-weight:700;color:#e0e6f0;letter-spacing:-.3px;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:10px;min-width:0}
#member-count{font-size:12px;color:#6b7a99;white-space:nowrap}
@media(max-width:430px){
  .header-title{font-size:16px}
  .header-right{gap:7px}
  #btn-export .btn-export-label{display:none}
  #btn-export{font-size:15px;padding:6px 10px;line-height:1}
}
@media(max-width:350px){#member-count{display:none}}
/* Version badge — always visible, overlaid on the active view */
#app-version{position:absolute;top:10px;left:10px;z-index:1000;font-size:11px;
  color:#5a6b8c;font-weight:600;letter-spacing:.3px;background:rgba(18,21,31,.82);
  border:1px solid #1e2538;border-radius:6px;padding:3px 7px;pointer-events:none;
  backdrop-filter:blur(6px)}
#btn-export{background:#1e2538;border:1px solid #2e3a56;color:#a0aec0;font-size:13px;
  padding:6px 12px;border-radius:8px;cursor:pointer;transition:background .15s}
#btn-export:hover{background:#2a3350}

#main{flex:1;overflow:hidden;position:relative}
#tree-view,#map-view{position:absolute;inset:0}

/* ── Tree ── */
#tree-svg{width:100%;height:100%;display:block;touch-action:none;
  background-color:#0f1117;
  background-image:radial-gradient(circle,rgba(74,144,226,.10) 1px,transparent 1.4px),
    radial-gradient(140% 90% at 50% 0%,#171c2c 0%,#0f1117 55%);
  background-size:26px 26px,100% 100%}
.node-inner{transform-box:fill-box;transform-origin:center;
  animation:node-in .45s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes node-in{from{transform:scale(0)}to{transform:scale(1)}}
.ring-pulse{transform-box:fill-box;transform-origin:center;
  animation:tree-ring-pulse 1.7s ease-out infinite}
@keyframes tree-ring-pulse{0%{transform:scale(.92);opacity:1}
  70%{transform:scale(1.16);opacity:.25}100%{transform:scale(1.2);opacity:0}}

/* Tree legend (top pill, matches map legend) */
#tree-legend{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;gap:12px;background:rgba(15,17,23,.85);border:1px solid #1e2538;
  border-radius:14px;padding:6px 12px;backdrop-filter:blur(8px);pointer-events:none}

/* Tree selection card (bottom, same glass style as map cards) */
#tree-card{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);width:min(calc(100% - 24px),420px);z-index:6;
  display:none;flex-direction:column;gap:10px;
  background:rgba(18,21,31,.92);border:1px solid #2e3a56;border-radius:18px;
  padding:12px 14px;backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.45);
  animation:card-up .25s ease}
@keyframes card-up{from{transform:translate(-50%,12px);opacity:0}
  to{transform:translate(-50%,0);opacity:1}}
.tree-card-top{display:flex;align-items:center;gap:12px}
.tree-card-btns{display:flex;gap:8px}
.tree-card-btn{flex:1;border:none;border-radius:11px;padding:11px 8px;
  font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
.tree-card-btn.primary{background:#4A90E2;color:#fff}
.tree-card-btn.primary:active{background:#357abd}
.tree-card-btn.ghost{background:#1e2538;color:#a0aec0;border:1px solid #2e3a56}
.tree-card-btn.ghost:active{background:#2a3350}

/* ── Map ── */
#leaflet-map{width:100%;height:100%}
#map-view{background:#0f1117}

/* Map status chip (top center) */
#map-chip{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:1000;
  display:flex;align-items:center;gap:7px;background:rgba(18,21,31,.88);
  border:1px solid #2e3a56;color:#a0aec0;font-size:12.5px;font-weight:600;
  padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;
  backdrop-filter:blur(10px);box-shadow:0 4px 16px rgba(0,0,0,.35)}
#map-chip:active{background:#1e2538}
#map-chip .chip-dot{width:7px;height:7px;border-radius:50%;background:#f59e0b;flex:none;
  animation:chip-blink 2.2s ease infinite}
@keyframes chip-blink{0%,100%{opacity:1}50%{opacity:.35}}

/* Relationship-line legend (below chip) */
#map-legend{position:absolute;top:54px;left:50%;transform:translateX(-50%);z-index:1000;
  display:flex;gap:12px;background:rgba(15,17,23,.85);border:1px solid #1e2538;
  border-radius:14px;padding:6px 12px;backdrop-filter:blur(8px);pointer-events:none}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#8892a4;font-weight:600}
.legend-line{width:16px;height:0;border-top:2.5px solid var(--c);border-radius:2px}
.legend-line.legend-dash{border-top-style:dashed}

/* Floating fit-all button */
#map-fit{position:absolute;right:12px;bottom:158px;z-index:1000;width:44px;height:44px;
  border-radius:50%;background:rgba(18,21,31,.9);border:1px solid #2e3a56;color:#a0aec0;
  font-size:19px;line-height:1;cursor:pointer;backdrop-filter:blur(8px);
  box-shadow:0 4px 16px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
#map-fit:active{background:#1e2538}

/* Avatar markers */
.mk{display:flex;flex-direction:column;align-items:center;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.55));
  animation:mk-in .4s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes mk-in{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.mk-ring{position:relative;width:52px;height:52px;border-radius:50%;padding:3px;
  background:var(--c);transition:transform .2s}
.mk-av{width:100%;height:100%;border-radius:50%;background:#1e2130;overflow:hidden;
  display:flex;align-items:center;justify-content:center;border:2px solid #0f1117}
.mk-av img{width:100%;height:100%;object-fit:cover}
.mk-av span{color:#fff;font-weight:700;font-size:17px;font-family:system-ui}
.mk-count{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;
  background:#4A90E2;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;
  justify-content:center;padding:0 5px;border:2px solid #0f1117}
.mk-name{margin-top:4px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:rgba(15,17,23,.82);border:1px solid #1e2538;color:#c9d1e0;font-size:10.5px;
  font-weight:600;padding:2px 8px;border-radius:10px;backdrop-filter:blur(4px)}
.mk-sel .mk-ring{transform:scale(1.12)}
.mk-sel .mk-ring::after{content:'';position:absolute;inset:-9px;border-radius:50%;
  border:3px solid var(--c);animation:mk-pulse 1.6s ease-out infinite;pointer-events:none}
@keyframes mk-pulse{0%{transform:scale(.72);opacity:.9}70%{transform:scale(1.22);opacity:0}100%{transform:scale(1.22);opacity:0}}

/* Bottom card carousel */
#map-cards{position:absolute;left:0;right:0;bottom:0;z-index:1000;display:flex;gap:10px;
  overflow-x:auto;scroll-snap-type:x mandatory;
  padding:8px 11vw calc(14px + env(safe-area-inset-bottom,0px));
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
#map-cards::-webkit-scrollbar{display:none}
.map-card{flex:0 0 min(78vw,320px);scroll-snap-align:center;display:flex;align-items:center;
  gap:12px;background:rgba(18,21,31,.92);border:1px solid #2e3a56;border-radius:18px;
  padding:12px 14px;backdrop-filter:blur(12px);cursor:pointer;text-align:left;color:inherit;
  box-shadow:0 8px 24px rgba(0,0,0,.45);transition:border-color .2s,box-shadow .2s}
.map-card.sel{border-color:#4A90E2;box-shadow:0 8px 28px rgba(74,144,226,.28)}
.map-card-av{width:52px;height:52px;border-radius:50%;flex:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;border:2px solid #2e3a56}
.map-card-av img{width:100%;height:100%;object-fit:cover}
.map-card-av span{color:#fff;font-weight:700;font-size:18px;font-family:system-ui}
.map-card-info{flex:1;min-width:0}
.map-card-name{font-size:15px;font-weight:700;color:#e0e6f0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-card-sub{font-size:12px;color:#8892a4;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-card-cta{font-size:11px;color:#4A90E2;font-weight:600;margin-top:3px}

/* Map empty state */
#map-empty{position:absolute;inset:0;z-index:1001;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 32px;
  background:linear-gradient(180deg,rgba(15,17,23,.55),rgba(15,17,23,.9))}
.map-empty-icon{font-size:54px}
.map-empty-title{font-size:19px;font-weight:700;color:#e0e6f0}
.map-empty-sub{font-size:13.5px;color:#8892a4;line-height:1.5;max-width:300px}
.map-empty-btn{margin-top:8px;background:#4A90E2;color:#fff;border:none;border-radius:12px;
  padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer}
.map-empty-btn:active{background:#357abd}

/* Generic bottom sheet overlay (map sheets) */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2140;
  display:flex;align-items:flex-end;backdrop-filter:blur(4px);animation:fade-in .2s ease}
.sheet-list{overflow-y:auto;flex:1;overscroll-behavior:contain;
  padding-bottom:env(safe-area-inset-bottom,12px)}

/* ── Bottom nav ── */
#bottom-nav{flex:none;display:flex;background:#12151f;border-top:1px solid #1e2538;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:10px 8px;background:none;border:none;cursor:pointer;color:#4a5568;transition:color .15s}
.nav-btn.active{color:#4A90E2}
.nav-btn:hover{color:#718096}
.nav-icon{font-size:22px;line-height:1}
.nav-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* ── Modal overlay ── */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2000;
  display:flex;align-items:flex-end;backdrop-filter:blur(4px);animation:fade-in .2s ease}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

/* ── Modal sheet ── */
.modal-sheet{width:100%;max-width:560px;margin:0 auto;background:#12151f;
  border-radius:20px 20px 0 0;border-top:1px solid #2e3a56;max-height:92dvh;
  overflow-y:auto;overscroll-behavior:contain;animation:slide-up .28s cubic-bezier(.32,.72,0,1)}
@keyframes slide-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:#2e3a56;border-radius:2px;margin:12px auto 8px}

/* ── Photo section ── */
.photo-sec{display:flex;flex-direction:column;align-items:center;padding:12px 16px 8px;gap:10px}
.avatar{width:90px;height:90px;border-radius:50%;background:#1e2538 center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;border:3px solid #2e3a56;
  position:relative;overflow:hidden;flex-shrink:0}
.avatar-initials{font-size:32px;font-weight:700;color:#a0aec0;pointer-events:none}
.avatar-cam{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;
  align-items:center;justify-content:center;font-size:28px;opacity:0;transition:opacity .15s;cursor:pointer}
.avatar:hover .avatar-cam,.avatar:active .avatar-cam{opacity:1}
.photo-btns{display:flex;gap:8px}
.btn-photo,.btn-photo-rm{font-size:13px;padding:6px 14px;border-radius:8px;
  border:1px solid #2e3a56;cursor:pointer;transition:background .15s}
.btn-photo{background:#1e2538;color:#a0aec0}.btn-photo:hover{background:#2a3350}
.btn-photo-rm{background:transparent;color:#f87171;border-color:rgba(248,113,113,.3)}
.btn-photo-rm:hover{background:rgba(248,113,113,.1)}

/* ── Modal body ── */
.modal-body{padding:8px 20px 4px}
.view-name{margin:0 0 14px;font-size:22px;font-weight:700;color:#e0e6f0}
.view-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;
  border-bottom:1px solid #1e2538;color:#c0c8d8;font-size:15px}
.view-row:last-child{border-bottom:none}
.row-icon{font-size:18px;flex:none}
.phone-link{color:#4A90E2;text-decoration:none}
.phone-link:hover{text-decoration:underline}
.person-link{color:#4A90E2;cursor:pointer;background:none;border:none;font:inherit;
  font-size:15px;padding:0;text-align:left}
.person-link:hover{text-decoration:underline}
.no-details{color:#4a5568;font-size:14px;margin:0;padding:8px 0}
.section-sep{height:1px;background:#1e2538;margin:8px 0}
.rel-section-title{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;color:#4a5568;margin:12px 0 4px}

/* ── Edit form ── */
.form-stack{display:flex;flex-direction:column;gap:10px}
.form-pair{display:flex;gap:10px}
.add-ctx{font-size:13px;color:#6b7a99;background:#1a1f2e;border:1px solid #2e3a56;
  border-radius:8px;padding:8px 12px;margin-bottom:2px}
.add-ctx strong{color:#a0aec0}
input.field{width:100%;background:#1a1f2e;border:1px solid #2e3a56;border-radius:10px;
  padding:13px 14px;font-size:15px;color:#e0e6f0;outline:none;transition:border-color .15s;
  -webkit-appearance:none;font-family:inherit}
input.field::placeholder{color:#4a5568}
input.field:focus{border-color:#4A90E2;background:#1e2538}

/* ── Modal actions ── */
.modal-actions{display:flex;gap:10px;padding:16px 20px 4px}
.btn-save,.btn-edit,.btn-cancel,.btn-del{flex:1;padding:14px;border-radius:12px;
  font-size:16px;font-weight:600;border:none;cursor:pointer;transition:background .15s,opacity .15s}
.btn-save,.btn-edit{background:#4A90E2;color:#fff}
.btn-save:hover,.btn-edit:hover{background:#357abd}
.btn-save:disabled{opacity:.6;cursor:wait}
.btn-cancel{background:#1e2538;color:#a0aec0}.btn-cancel:hover{background:#2a3350}
.btn-cancel:disabled{opacity:.6}
.btn-del{flex:0 1 auto;padding:14px 20px;background:rgba(239,68,68,.15);
  color:#f87171;border:1px solid rgba(239,68,68,.3)}
.btn-del:hover{background:rgba(239,68,68,.25)}

/* ── Relationship picker ── */
#rel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2100;
  display:flex;align-items:flex-end;backdrop-filter:blur(4px);animation:fade-in .2s ease}
.rel-sheet{width:100%;max-width:560px;margin:0 auto;background:#12151f;
  border-radius:20px 20px 0 0;border-top:1px solid #2e3a56;
  animation:slide-up .28s cubic-bezier(.32,.72,0,1);
  padding-bottom:env(safe-area-inset-bottom,8px)}
.rel-title{font-size:15px;font-weight:600;color:#8892a4;text-align:center;
  padding:4px 20px 8px}
.rel-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 16px 12px}
.rel-btn{background:#1e2538;border:1px solid #2e3a56;border-radius:14px;
  padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;color:#c0c8d8;transition:background .15s,border-color .15s;width:100%}
.rel-btn:hover,.rel-btn:active{background:#2a3350;border-color:#4A90E2}
.rel-btn:disabled{opacity:.4;cursor:not-allowed}
.rel-btn-icon{font-size:28px;line-height:1}
.rel-btn-label{font-size:14px;font-weight:600}
.rel-btn-sub{font-size:11px;color:#4a5568}
.rel-cancel-btn{width:calc(100% - 32px);margin:0 16px 8px;padding:14px;background:#1e2538;
  border:none;border-radius:12px;font-size:16px;font-weight:600;color:#a0aec0;cursor:pointer}
.rel-cancel-btn:hover{background:#2a3350}

/* ── Link choice overlay (New vs Existing) ── */
#link-choice-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2110;
  display:flex;align-items:flex-end;backdrop-filter:blur(4px);animation:fade-in .2s ease}
.link-choice{display:flex;flex-direction:column;gap:10px;padding:4px 16px 12px}
.link-choice-btn{background:#1e2538;border:1px solid #2e3a56;border-radius:14px;
  padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;
  text-align:left;color:#c0c8d8;transition:background .15s,border-color .15s;width:100%}
.link-choice-btn:hover,.link-choice-btn:active{background:#2a3350;border-color:#4A90E2}
.link-choice-icon{font-size:28px;flex:none;line-height:1}
.link-choice-label{font-size:15px;font-weight:600;margin-bottom:2px}
.link-choice-sub{font-size:12px;color:#6b7a99}

/* ── Person picker overlay ── */
#person-picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2120;
  display:flex;align-items:flex-end;backdrop-filter:blur(4px);animation:fade-in .2s ease}
.person-picker-sheet{width:100%;max-width:560px;margin:0 auto;background:#12151f;
  border-radius:20px 20px 0 0;border-top:1px solid #2e3a56;
  animation:slide-up .28s cubic-bezier(.32,.72,0,1);
  max-height:80dvh;display:flex;flex-direction:column}
.picker-header{padding:4px 16px 12px;flex:none}
.picker-title{font-size:14px;color:#8892a4;text-align:center;padding:4px 0 10px}
.picker-title strong{color:#c0c8d8}
input.picker-search{width:100%}
#picker-list{overflow-y:auto;flex:1;overscroll-behavior:contain;
  padding-bottom:env(safe-area-inset-bottom,12px)}
.picker-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;
  background:none;border:none;border-bottom:1px solid #1a1f2e;cursor:pointer;
  text-align:left;transition:background .12s}
.picker-item:hover,.picker-item:active{background:#1a1f2e}
.picker-item:last-child{border-bottom:none}
.picker-item-avatar{width:44px;height:44px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.picker-item-avatar span{color:#fff;font-weight:700;font-size:16px;font-family:system-ui}
.picker-item-info{flex:1;min-width:0}
.picker-item-name{font-size:15px;font-weight:600;color:#e0e6f0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-item-sub{font-size:12px;color:#6b7a99;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-item-arrow{color:#4a5568;font-size:20px;flex:none}
.picker-empty{padding:32px 16px;text-align:center;color:#4a5568;font-size:14px}

/* ── Fit button ── */
#btn-fit{background:#1e2538;border:1px solid #2e3a56;color:#a0aec0;font-size:15px;
  padding:6px 10px;border-radius:8px;cursor:pointer;transition:background .15s;line-height:1}
#btn-fit:hover{background:#2a3350}

/* ── Leaflet overrides ── */
.leaflet-container{background:#0f1117;font-family:inherit}
.leaflet-control-attribution{background:rgba(15,17,23,.72)!important;
  color:#3d4a66!important;font-size:9px!important}
.leaflet-control-attribution a{color:#4a5568!important}

/* ── Tap hint ── */
#tap-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  background:rgba(15,17,23,.85);border:1px solid #2e3a56;color:#6b7a99;font-size:11px;
  padding:5px 12px;border-radius:16px;pointer-events:none;white-space:nowrap;
  backdrop-filter:blur(6px);z-index:5;transition:opacity .3s}

/* ── Gender selector ── */
.gender-btn{flex:1;background:#1a1f2e;border:1px solid #2e3a56;border-radius:10px;
  padding:11px 8px;font-size:14px;font-weight:600;color:#6b7a99;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;font-family:inherit}
.gender-btn:hover{background:#1e2538;color:#a0aec0}
.gender-btn.gender-male{background:#1e3052;border-color:#3b82f6;color:#93c5fd}
.gender-btn.gender-female{background:#3d1030;border-color:#ec4899;color:#f9a8d4}
.gender-btn.gender-nonbinary{background:#2d1a50;border-color:#a855f7;color:#d8b4fe}

/* ── Refresh button ── */

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════════════════════ */
const STORAGE_KEY = 'familytree_v2';
/* ALWAYS bump APP_VERSION on every release — it is shown as a badge on the UI */
const APP_VERSION = 'v3.2';
const DB_NAME     = 'familytree_photos';
const DB_STORE    = 'photos';
const NODE_R      = 36;
const V_GAP       = 170;

/* Relationship colors */
const RC = {
  parent:  '#f97316',
  child:   '#22c55e',
  spouse:  '#ec4899',
  sibling: '#a855f7',
  self:    '#ffffff',
};

const COLORS = ['#4A90E2','#E67E22','#2ECC71','#9B59B6','#E74C3C','#1ABC9C','#F39C12','#e84393'];
const REL_LABELS = { child:'child', spouse:'spouse / partner', sibling:'sibling', parent:'parent' };
const REL_ICONS  = { child:'👶', spouse:'💑', sibling:'👫', parent:'👆' };

/* Sub-typed relationship keys — each maps to a base relType + default gender */
const REL_SUB = {
  son:     { type:'child',   gender:'male',   icon:'👦', label:'Son'     },
  daughter:{ type:'child',   gender:'female', icon:'👧', label:'Daughter'},
  husband: { type:'spouse',  gender:'male',   icon:'🤵', label:'Husband' },
  wife:    { type:'spouse',  gender:'female', icon:'👰', label:'Wife'    },
  father:  { type:'parent',  gender:'male',   icon:'👨', label:'Father'  },
  mother:  { type:'parent',  gender:'female', icon:'👩', label:'Mother'  },
  brother: { type:'sibling', gender:'male',   icon:'👦', label:'Brother' },
  sister:  { type:'sibling', gender:'female', icon:'👧', label:'Sister'  },
};

/* ═══════════════════════════════════════════════════════════════
   APP STATE
═══════════════════════════════════════════════════════════════ */
const S = {
  data:       null,
  photos:     {},
  view:       'tree',
  modal:      null,
  relpick:    null,
  linkpick:   null,
  personpick: null,
  search:     null,
  highlight:  null,  // id of currently highlighted person
  mapSel:     null,  // id of person selected on the map
  _pos:       {},    // cached node positions {id: {x,y}}
  _layoutDirty: true,
};

/* ═══════════════════════════════════════════════════════════════
   BOOTSTRAP
═══════════════════════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', async () => {
  S.data = dataLoad();
  await photosLoadAll();
  treeInit();
  mapInit();
  treeRender();
  treeHome();
  headerUpdate();
  navSetup();
  document.getElementById('app-version').textContent = APP_VERSION;
  document.getElementById('btn-export').addEventListener('click', doExport);
  document.getElementById('btn-import').addEventListener('click', doImportClick);
  document.getElementById('btn-fit').addEventListener('click', treeFit);
  document.getElementById('btn-refresh').addEventListener('click', layoutRefresh);

  /* Clear highlight when tapping the SVG background */
  document.getElementById('tree-svg').addEventListener('click', e => {
    if (e.target === document.getElementById('tree-svg') ||
        e.target === document.getElementById('tree-g')) {
      if (S.highlight) { S.highlight = null; treeRender(); }
    }
  });

  /* Hide tap hint after first interaction */
  document.getElementById('tree-svg').addEventListener('click', () => {
    const h = document.getElementById('tap-hint');
    if (h) { h.style.opacity = '0'; setTimeout(() => h.remove(), 300); }
  }, { once: true });
});

/* ═══════════════════════════════════════════════════════════════
   MIGRATION  (v1 parentId/virtual  →  v2 parents[]/links[])
═══════════════════════════════════════════════════════════════ */
function migrateData(d) {
  if (!d || !d.people) return;
  if (d.links !== undefined) {
    /* Already v2: ensure every person has parents[] */
    Object.values(d.people).forEach(p => {
      if (!Array.isArray(p.parents)) p.parents = [];
      if (!Array.isArray(p.children)) p.children = [];
      if (p.spouseId === undefined) p.spouseId = null;
      if (p.gender   === undefined) p.gender = '';
      delete p.virtual; delete p.parentId;
    });
    return;
  }

  const people = d.people;
  const virtualIds = new Set(Object.values(people).filter(p => p.virtual).map(p => p.id));

  /* Step 1: assign parents[] to real people */
  Object.values(people).forEach(p => {
    if (p.virtual) return;
    if (!p.parentId || virtualIds.has(p.parentId)) {
      /* parentId points at a virtual node: go one level up */
      const vp = p.parentId ? people[p.parentId] : null;
      p.parents = (vp && vp.parentId && !virtualIds.has(vp.parentId)) ? [vp.parentId] : [];
    } else {
      p.parents = [p.parentId];
    }
  });

  /* Step 2: fix children[] on real nodes (remove virtual IDs, flatten) */
  Object.values(people).forEach(p => {
    if (p.virtual) return;
    const fixed = [];
    (p.children || []).forEach(cid => {
      if (!virtualIds.has(cid)) { fixed.push(cid); return; }
      const vp = people[cid];
      if (vp) (vp.children || []).filter(c => !virtualIds.has(c)).forEach(c => fixed.push(c));
    });
    p.children = [...new Set(fixed)];
  });

  /* Step 3: fix rootId */
  while (d.rootId && virtualIds.has(d.rootId)) {
    const vp = people[d.rootId];
    const real = (vp?.children || []).find(c => !virtualIds.has(c));
    d.rootId = real || Object.keys(people).find(id => !virtualIds.has(id)) || d.rootId;
    break;
  }

  /* Step 4: delete virtual nodes and old fields */
  virtualIds.forEach(id => delete people[id]);
  Object.values(people).forEach(p => { delete p.parentId; delete p.virtual; });

  d.links = [];
}

/* ═══════════════════════════════════════════════════════════════
   LOCAL STORAGE
═══════════════════════════════════════════════════════════════ */
function dataLoad() {
  for (const key of [STORAGE_KEY, 'familytree_v1']) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) continue;
      const d = JSON.parse(raw);
      migrateData(d);
      return d;
    } catch {}
  }
  const id = uid();
  return {
    rootId: id,
    people: { [id]: mkPerson(id, [], { firstName:'You' }) },
    links: []
  };
}
function dataSave() { localStorage.setItem(STORAGE_KEY, JSON.stringify(S.data)); }

/* ═══════════════════════════════════════════════════════════════
   INDEXEDDB — photos
═══════════════════════════════════════════════════════════════ */
function dbOpen() {
  return new Promise((ok, fail) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
    req.onsuccess = () => ok(req.result);
    req.onerror   = () => fail(req.error);
  });
}

async function photosLoadAll() {
  const ids = Object.values(S.data.people).filter(p => p.photoId).map(p => p.photoId);
  if (!ids.length) return;
  try {
    const db = await dbOpen();
    await Promise.all(ids.map(id => new Promise(res => {
      const r = db.transaction(DB_STORE).objectStore(DB_STORE).get(id);
      r.onsuccess = () => { if (r.result) S.photos[id] = r.result; res(); };
      r.onerror   = () => res();
    })));
  } catch {}
}

async function photoStore(id, dataUrl) {
  try {
    const db = await dbOpen();
    await new Promise((ok, fail) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(dataUrl, id);
      tx.oncomplete = ok; tx.onerror = fail;
    });
  } catch {}
}

async function photoDelete(id) {
  if (!id) return;
  try {
    const db = await dbOpen();
    await new Promise((ok, fail) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(id);
      tx.oncomplete = ok; tx.onerror = fail;
    });
  } catch {}
}

async function photoCompress(file) {
  return new Promise(res => {
    const img = new Image();
    const blobUrl = URL.createObjectURL(file);
    img.onload = () => {
      const sz = 240, c = document.createElement('canvas');
      c.width = c.height = sz;
      const ctx = c.getContext('2d');
      const min = Math.min(img.naturalWidth, img.naturalHeight);
      ctx.drawImage(img, (img.naturalWidth-min)/2, (img.naturalHeight-min)/2, min, min, 0, 0, sz, sz);
      URL.revokeObjectURL(blobUrl);
      res(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => { URL.revokeObjectURL(blobUrl); res(null); };
    img.src = blobUrl;
  });
}

/* ═══════════════════════════════════════════════════════════════
   GEOCODING
═══════════════════════════════════════════════════════════════ */
const geoCache = new Map();
async function geocode(str) {
  if (!str?.trim()) return null;
  const key = str.trim().toLowerCase();
  if (geoCache.has(key)) return geoCache.get(key);
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(str)}&format=json&limit=1`,
      { headers: {'Accept-Language':'en-US,en'} }
    );
    const data = await r.json();
    if (data?.[0]) {
      const coords = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      geoCache.set(key, coords);
      return coords;
    }
  } catch {}
  return null;
}

/* ═══════════════════════════════════════════════════════════════
   CRUD
═══════════════════════════════════════════════════════════════ */
function mkPerson(id, parents, fields) {
  return {
    id,
    parents:    parents || [],
    children:   [],
    spouseId:   null,
    firstName:  '',
    lastName:   '',
    gender:     '',
    location:   '',
    lat:        null,
    lng:        null,
    occupation: '',
    phone:      '',
    photoId:    null,
    ...fields
  };
}

function personAddRel(contextId, relType, fields) {
  const id  = uid();
  const ctx = S.data.people[contextId];
  if (!ctx) return null;

  if (relType === 'child') {
    const parents = [contextId];
    /* Smart: auto-add spouse as co-parent */
    if (ctx.spouseId && S.data.people[ctx.spouseId]) {
      parents.push(ctx.spouseId);
      S.data.people[ctx.spouseId].children.push(id);
    }
    S.data.people[id] = mkPerson(id, parents, fields);
    ctx.children.push(id);

  } else if (relType === 'spouse') {
    if (ctx.spouseId) return null;
    S.data.people[id] = mkPerson(id, [], { ...fields, spouseId: contextId });
    ctx.spouseId = id;

  } else if (relType === 'sibling') {
    S.data.people[id] = mkPerson(id, [...(ctx.parents || [])], fields);
    /* Add to all shared parents' children lists */
    (ctx.parents || []).forEach(pid => {
      const par = S.data.people[pid];
      if (par && !par.children.includes(id)) par.children.push(id);
    });
    /* No shared parent: create explicit sibling link */
    if (!ctx.parents.length) {
      S.data.links.push({ type: 'sibling', a: contextId, b: id });
    }

  } else if (relType === 'parent') {
    S.data.people[id] = mkPerson(id, [], { ...fields, children: [contextId] });
    if (!ctx.parents.includes(id)) ctx.parents.push(id);
    if (contextId === S.data.rootId) S.data.rootId = id;
  }

  S._pos = {};
  S._layoutDirty = true;
  return id;
}

function personUpdate(id, fields) { Object.assign(S.data.people[id], fields); }

function removeFromParents(id) {
  const p = S.data.people[id]; if (!p) return;
  (p.parents || []).forEach(pid => {
    const par = S.data.people[pid];
    if (par) par.children = par.children.filter(c => c !== id);
  });
  p.parents = [];
  S.data.links = (S.data.links || []).filter(l => l.a !== id && l.b !== id);
}

function personDelete(id) {
  function sweep(pid) {
    const p = S.data.people[pid]; if (!p) return;
    if (p.spouseId && S.data.people[p.spouseId]) S.data.people[p.spouseId].spouseId = null;
    (p.parents || []).forEach(parentId => {
      const par = S.data.people[parentId];
      if (par) par.children = par.children.filter(c => c !== pid);
    });
    S.data.links = (S.data.links || []).filter(l => l.a !== pid && l.b !== pid);
    const kids = [...(p.children || [])];
    delete S.data.people[pid];
    kids.forEach(sweep);
  }

  const p = S.data.people[id]; if (!p) return;
  if (id === S.data.rootId) {
    const newRoot = (p.children || [])[0]
      || Object.keys(S.data.people).find(k => k !== id)
      || null;
    if (newRoot) S.data.rootId = newRoot;
  }
  sweep(id);

  if (!S.data.people[S.data.rootId]) {
    const remaining = Object.keys(S.data.people);
    if (remaining.length) {
      S.data.rootId = remaining[0];
    } else {
      const nid = uid();
      S.data.rootId = nid;
      S.data.people[nid] = mkPerson(nid, [], { firstName: 'You' });
    }
  }
  S._pos = {};
  S._layoutDirty = true;
}

function getAncestors(id) {
  const result = new Set();
  const queue  = [...(S.data.people[id]?.parents || [])];
  while (queue.length) {
    const pid = queue.shift();
    if (result.has(pid)) continue;
    result.add(pid);
    const p = S.data.people[pid];
    if (p) (p.parents || []).forEach(gid => { if (!result.has(gid)) queue.push(gid); });
  }
  return result;
}

function getDescendants(id) {
  const result = new Set();
  function walk(pid) {
    const p = S.data.people[pid]; if (!p) return;
    (p.children || []).forEach(cid => { result.add(cid); walk(cid); });
  }
  walk(id);
  return result;
}

function getEligiblePeople(contextId, relType) {
  const ctx = S.data.people[contextId];
  if (!ctx) return [];
  const ancestors   = getAncestors(contextId);
  const descendants = getDescendants(contextId);
  const ctxSibIds   = new Set(
    (ctx.parents || []).flatMap(pid => (S.data.people[pid]?.children || []))
      .filter(c => c !== contextId)
  );

  return Object.values(S.data.people).filter(p => {
    if (p.id === contextId) return false;
    if (relType === 'spouse')  return !ctx.spouseId && !p.spouseId;
    if (relType === 'child')   return !ancestors.has(p.id) && !(ctx.children||[]).includes(p.id);
    if (relType === 'parent')  return !descendants.has(p.id) && !(ctx.parents||[]).includes(p.id);
    if (relType === 'sibling') return !ctxSibIds.has(p.id);
    return true;
  });
}

function linkExisting(contextId, relType, targetId) {
  const ctx = S.data.people[contextId];
  const tgt = S.data.people[targetId];
  if (!ctx || !tgt || contextId === targetId) return;

  if (relType === 'spouse') {
    if (ctx.spouseId || tgt.spouseId) return;
    ctx.spouseId = targetId;
    tgt.spouseId = contextId;

  } else if (relType === 'child') {
    if (getAncestors(contextId).has(targetId)) {
      alert('Cannot add: this would create a circular relationship.'); return;
    }
    removeFromParents(targetId);
    if (!tgt.parents.includes(contextId)) tgt.parents.push(contextId);
    /* Auto-add spouse as co-parent */
    if (ctx.spouseId && S.data.people[ctx.spouseId] && !tgt.parents.includes(ctx.spouseId)) {
      tgt.parents.push(ctx.spouseId);
      const sp = S.data.people[ctx.spouseId];
      if (!sp.children.includes(targetId)) sp.children.push(targetId);
    }
    if (!ctx.children.includes(targetId)) ctx.children.push(targetId);
    if (S.data.rootId === targetId) S.data.rootId = contextId;

  } else if (relType === 'sibling') {
    removeFromParents(targetId);
    tgt.parents = [...(ctx.parents || [])];
    tgt.parents.forEach(pid => {
      const par = S.data.people[pid];
      if (par && !par.children.includes(targetId)) par.children.push(targetId);
    });
    if (!tgt.parents.length) {
      const already = (S.data.links || []).some(l =>
        l.type === 'sibling' &&
        ((l.a === contextId && l.b === targetId) || (l.a === targetId && l.b === contextId))
      );
      if (!already) S.data.links.push({ type: 'sibling', a: contextId, b: targetId });
    }

  } else if (relType === 'parent') {
    if (getDescendants(contextId).has(targetId)) {
      alert('Cannot add: this would create a circular relationship.'); return;
    }
    if (!ctx.parents.includes(targetId)) ctx.parents.push(targetId);
    if (!tgt.children.includes(contextId)) tgt.children.push(contextId);
    if (S.data.rootId === contextId) S.data.rootId = targetId;
  }

  S._pos = {};
  S._layoutDirty = true;
  dataSave();
  treeRender();
  headerUpdate();
  treeHome(targetId);
}

/* ═══════════════════════════════════════════════════════════════
   COLOR HELPER (for map markers)
═══════════════════════════════════════════════════════════════ */
function personColor(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) & 0xfffffff;
  return COLORS[h % COLORS.length];
}

/* ═══════════════════════════════════════════════════════════════
   TREE VIEW
═══════════════════════════════════════════════════════════════ */
let treeZoom;

function treeInit() {
  const svg = d3.select('#tree-svg');
  treeZoom = d3.zoom().scaleExtent([0.08, 4])
    .on('zoom', ({ transform }) => d3.select('#tree-g').attr('transform', transform));
  svg.call(treeZoom);
  const svgEl = document.getElementById('tree-svg');
  const w = svgEl.clientWidth || window.innerWidth;
  const h = svgEl.clientHeight || (window.innerHeight - 112);
  svg.call(treeZoom.transform, d3.zoomIdentity.translate(w / 2, h * 0.35));
}

/* Deterministic family-graph layout.
   - Couples form one unit; rows come from walking spouse/parent/child edges
     (never sibling links, which only draw as dashed curves).
   - Ancestors of married-in spouses are placed INLINE: directly above the
     unit they married into, on the side of that spouse — not as far-away
     separate trees.
   - Every branch owns an exclusive x-interval, so overlaps are impossible.
   Returns nodeById map. Caches to S._pos. */
function layoutNodes() {
  const people = S.data.people;
  const ids    = Object.keys(people);
  if (!ids.length) return {};

  const H_SLOT   = NODE_R * 2 + 40;  // horizontal footprint per person (room for labels)
  const SIB_GAP  = 36;               // gap between adjacent branches
  const ROOT_GAP = 130;              // gap between unrelated components

  /* 1. Group people into units: a spouse couple is one unit, singles their own */
  const unitOf = {};
  const units  = [];
  ids.forEach(id => {
    if (unitOf[id]) return;
    const p = people[id];
    const u = { members: [id], down: [], up: [], row: 0, x: 0 };
    if (p.spouseId && people[p.spouseId] && !unitOf[p.spouseId]) u.members.push(p.spouseId);
    /* Blood-line member (has parents in the tree) goes first for tidier elbows */
    if (u.members.length === 2) {
      const hasPar = m => (people[m].parents || []).some(pid => people[pid]);
      if (!hasPar(u.members[0]) && hasPar(u.members[1])) u.members.reverse();
    }
    u.members.forEach(m => { unitOf[m] = u; });
    units.push(u);
  });

  /* 2. Spanning traversal over the family graph. Rows are derived here, so a
     parent unit is ALWAYS exactly one row above its child unit. Each unit is
     claimed once: either below its parents (down) or above the spouse who
     married into the branch (up). */
  const visited = new Set();
  function build(u, row) {
    visited.add(u);
    u.row = row;
    /* Children units below */
    u.members.forEach(m => {
      (people[m].children || []).forEach(cid => {
        const cu = unitOf[cid];
        if (cu && !visited.has(cu)) { build(cu, row + 1); u.down.push(cu); }
      });
    });
    /* In-law ancestor units above, tagged with which member they belong to */
    u.members.forEach((m, mi) => {
      const parentUnits = [...new Set((people[m].parents || [])
        .map(pid => unitOf[pid]).filter(Boolean))];
      parentUnits.forEach(pu => {
        if (!visited.has(pu)) { build(pu, row - 1); u.up.push({ unit: pu, side: mi }); }
      });
    });
    /* Children whose spouse brings a left-side family go left, right-side go
       right — keeps each in-law branch next to the child it connects to and
       out of the way of this unit's own bus bar. */
    const sideOf = c => c.up.length ? (c.up.every(b => b.side === 0) ? -1 : 1) : 0;
    u.down.sort((a, b) => sideOf(a) - sideOf(b));
  }

  const anchors = [];
  const rootUnit = unitOf[S.data.rootId];
  if (rootUnit) { build(rootUnit, 0); anchors.push(rootUnit); }
  units.forEach(u => { if (!visited.has(u)) { build(u, 0); anchors.push(u); } });

  /* 3. Recursive placement: [left in-law branches] [children] [right in-law
     branches], each in its own exclusive x-interval */
  const branchesOf = u => [
    ...u.up.filter(b => b.side === 0).map(b => b.unit),
    ...u.down,
    ...u.up.filter(b => b.side > 0).map(b => b.unit),
  ];
  const shiftTree = (u, dx) => { u.x += dx; branchesOf(u).forEach(c => shiftTree(c, dx)); };
  function place(u, left) {
    const selfW    = u.members.length * H_SLOT;
    const leftUps  = u.up.filter(b => b.side === 0).map(b => b.unit);
    const rightUps = u.up.filter(b => b.side > 0).map(b => b.unit);

    /* Left in-law branches first; the unit itself must stay clear of them */
    let cur = left;
    leftUps.forEach(b => { if (cur > left) cur += SIB_GAP; cur = place(b, cur); });
    const downLeft = (cur > left) ? cur + SIB_GAP : left;

    /* Own children below */
    cur = downLeft;
    u.down.forEach((b, i) => { if (i) cur += SIB_GAP; cur = place(b, cur); });

    /* Center on own children (bus-bar alignment), clamped clear of the left region */
    let cx = u.down.length
      ? (u.down[0].x + u.down[u.down.length - 1].x) / 2
      : downLeft + selfW / 2;
    if (cx - selfW / 2 < downLeft) {
      const shift = downLeft + selfW / 2 - cx;
      u.down.forEach(b => shiftTree(b, shift));
      cur += shift; cx += shift;
    }
    u.x = cx;

    /* Right in-law branches start clear of the unit itself */
    cur = Math.max(cur, cx + selfW / 2);
    rightUps.forEach(b => { cur += SIB_GAP; cur = place(b, cur); });
    return cur;
  }

  /* 4. Main family first, then remaining components by size */
  const sizeOf = u => 1 + branchesOf(u).reduce((a, c) => a + sizeOf(c), 0);
  const rest = anchors.slice(1).sort((a, b) => sizeOf(b) - sizeOf(a));
  let cursor = 0;
  [...anchors.slice(0, 1), ...rest].forEach((r, i) => {
    if (i) cursor += ROOT_GAP;
    cursor = place(r, cursor);
  });

  /* 5. Unit → person positions, centered around x = 0 */
  const nodeById = {};
  units.forEach(u => {
    const n = u.members.length;
    u.members.forEach((m, i) => {
      nodeById[m] = { id: m, x: u.x + (i - (n - 1) / 2) * H_SLOT, y: u.row * V_GAP };
    });
  });
  const xs = Object.values(nodeById).map(n => n.x);
  const midX = (Math.min(...xs) + Math.max(...xs)) / 2;
  Object.values(nodeById).forEach(n => {
    n.x -= midX;
    S._pos[n.id] = { x: n.x, y: n.y };
  });
  return nodeById;
}

/* Compute which nodes are highlighted relatives of `id` */
function computeHighlight(id) {
  const p = S.data.people[id];
  if (!p) return null;
  const h = {
    self:     new Set([id]),
    parents:  new Set(p.parents || []),
    children: new Set(p.children || []),
    spouses:  new Set(),
    siblings: new Set(),
  };
  if (p.spouseId) h.spouses.add(p.spouseId);
  (p.parents || []).forEach(pid => {
    (S.data.people[pid]?.children || []).filter(c => c !== id).forEach(c => h.siblings.add(c));
  });
  (S.data.links || []).forEach(lk => {
    if (lk.type !== 'sibling') return;
    if (lk.a === id) h.siblings.add(lk.b);
    if (lk.b === id) h.siblings.add(lk.a);
  });
  return h;
}

function treeRender() {
  const people = S.data.people;
  const ids    = Object.keys(people);
  if (!ids.length) return;

  /* Re-run layout only when data changed */
  const nodeById = S._layoutDirty ? layoutNodes() : (() => {
    /* Rebuild nodeById from cached positions */
    const nb = {};
    ids.forEach(id => {
      if (!S._pos[id]) { S._layoutDirty = true; }
      nb[id] = { id, x: (S._pos[id] || {}).x || 0, y: (S._pos[id] || {}).y || 0 };
    });
    if (S._layoutDirty) return layoutNodes();
    return nb;
  })();
  const animateIn = S._layoutDirty;  // play entrance animation only when layout changed
  S._layoutDirty = false;

  /* Clip paths for photos */
  document.getElementById('tree-defs').innerHTML = ids
    .filter(id => people[id].photoId && S.photos[people[id].photoId])
    .map(id => `<clipPath id="cp-${id}"><circle r="${NODE_R}"/></clipPath>`)
    .join('');

  const hl = S.highlight ? computeHighlight(S.highlight) : null;

  /* ── LINKS ── */
  let svg = '';

  /* Spouse links */
  const seenSp = new Set();
  ids.forEach(id => {
    const p = people[id];
    if (!p.spouseId || seenSp.has(id)) return;
    const n1 = nodeById[id], n2 = nodeById[p.spouseId];
    if (!n1 || !n2) return;
    seenSp.add(id); seenSp.add(p.spouseId);
    const mx = (n1.x + n2.x) / 2, my = (n1.y + n2.y) / 2;
    svg += `<line x1="${n1.x}" y1="${n1.y}" x2="${n2.x}" y2="${n2.y}"
      stroke="${RC.spouse}" stroke-width="2.5" stroke-dasharray="6,4" stroke-linecap="round"/>`;
    svg += `<text x="${mx}" y="${my}" text-anchor="middle" dominant-baseline="central"
      font-size="14" font-family="system-ui" fill="${RC.spouse}"
      stroke="#0f1117" stroke-width="3" paint-order="stroke">♥</text>`;
  });

  /* Parent → child connections */
  const drawnBus = new Set();
  ids.forEach(id => {
    const p = people[id];
    const src = nodeById[id]; if (!src) return;
    const children = (p.children || []).filter(c => nodeById[c]);
    if (!children.length) return;

    const spouseNode = p.spouseId ? nodeById[p.spouseId] : null;

    /* Shared children (both parents present) */
    const sharedKids = spouseNode ? children.filter(cid =>
      (people[cid]?.parents || []).includes(p.spouseId)
    ) : [];
    const soleKids = children.filter(c => !sharedKids.includes(c));

    /* Bus-bar for couple's shared children */
    if (sharedKids.length && spouseNode) {
      const pairKey = [id, p.spouseId].sort().join('|');
      if (!drawnBus.has(pairKey)) {
        drawnBus.add(pairKey);
        const midX  = (src.x + spouseNode.x) / 2;
        /* Stagger drop heights so neighboring family buses never overlap */
        const dropY = src.y + V_GAP * (0.34 + (drawnBus.size % 4) * 0.05);
        const childNodes = sharedKids.map(c => nodeById[c]).filter(Boolean);
        const xs = childNodes.map(c => c.x);
        const minX = Math.min(...xs), maxX = Math.max(...xs);

        svg += `<line x1="${midX}" y1="${src.y + NODE_R + 2}" x2="${midX}" y2="${dropY}"
          stroke="${RC.parent}" stroke-width="2.5" stroke-linecap="round"/>`;
        if (childNodes.length > 1) {
          svg += `<line x1="${minX}" y1="${dropY}" x2="${maxX}" y2="${dropY}"
            stroke="${RC.parent}" stroke-width="2.5"/>`;
        }
        childNodes.forEach(cn => {
          svg += `<line x1="${cn.x}" y1="${dropY}" x2="${cn.x}" y2="${cn.y - NODE_R - 2}"
            stroke="${RC.parent}" stroke-width="2.5" stroke-linecap="round"/>`;
        });
      }
    }

    /* Elbow for sole-parent children */
    soleKids.forEach(cid => {
      const cn = nodeById[cid]; if (!cn) return;
      const midY = (src.y + cn.y) / 2;
      svg += `<path d="M${src.x},${src.y + NODE_R + 2} V${midY} H${cn.x} V${cn.y - NODE_R - 2}"
        fill="none" stroke="${RC.parent}" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>`;
    });
  });

  /* Explicit sibling links (no shared parent) */
  (S.data.links || []).forEach(lk => {
    if (lk.type !== 'sibling') return;
    const n1 = nodeById[lk.a], n2 = nodeById[lk.b];
    if (!n1 || !n2) return;
    const cp = Math.abs(n2.y - n1.y) * 0.45 + 30;
    svg += `<path d="M${n1.x},${n1.y} C${n1.x},${n1.y + cp} ${n2.x},${n2.y - cp} ${n2.x},${n2.y}"
      fill="none" stroke="${RC.sibling}" stroke-width="2" stroke-dasharray="5,4"/>`;
  });

  /* ── NODES ── */
  let idx = 0;
  ids.forEach(id => {
    const p  = people[id];
    const n  = nodeById[id]; if (!n) return;
    const photo = p.photoId ? S.photos[p.photoId] : null;
    const init  = initials(p);
    const isRoot = id === S.data.rootId;

    /* Highlight ring */
    let ringColor = 'none', selfSel = false;
    let nodeOpacity = 1;
    if (hl) {
      if (hl.self.has(id))          { ringColor = RC.self; selfSel = true; }
      else if (hl.parents.has(id))  ringColor = RC.parent;
      else if (hl.children.has(id)) ringColor = RC.child;
      else if (hl.spouses.has(id))  ringColor = RC.spouse;
      else if (hl.siblings.has(id)) ringColor = RC.sibling;
      else nodeOpacity = 0.22;
    }

    const gradId = isRoot ? 'g-root'
      : ({ male:'g-male', female:'g-female', nonbinary:'g-nb' }[p.gender] || 'g-def');
    const ringCol = { male:'#3b82f6', female:'#ec4899', nonbinary:'#a855f7' }[p.gender]
      || (isRoot ? '#818cf8' : '#4A90E2');
    const genderMark  = { male:'♂', female:'♀', nonbinary:'⚧' }[p.gender] || '';
    const face = photo
      ? `<image href="${photo}" x="${-NODE_R}" y="${-NODE_R}"
           width="${NODE_R*2}" height="${NODE_R*2}"
           clip-path="url(#cp-${id})" preserveAspectRatio="xMidYMid slice"/>`
      : `<text text-anchor="middle" dominant-baseline="central" fill="white"
           font-size="${(NODE_R*.55)|0}" font-weight="700" font-family="system-ui"
           pointer-events="none">${eh(init)}</text>`;

    const innerStyle = animateIn
      ? ` style="animation-delay:${Math.min(idx * 30, 420)}ms"`
      : ` style="animation:none"`;

    svg += `
      <g class="t-node" data-id="${id}" transform="translate(${n.x},${n.y})"
         style="opacity:${nodeOpacity};cursor:pointer">
        <g class="node-inner"${innerStyle}>
          <circle class="${selfSel ? 'ring-pulse' : ''}" r="${NODE_R + 7}" fill="none"
            stroke="${ringColor}" stroke-width="3.5" pointer-events="none"/>
          <circle r="${NODE_R + 5}" fill="transparent"/>
          <circle r="${NODE_R}" fill="${photo ? '#1e2130' : `url(#${gradId})`}"
            stroke="${photo ? ringCol : 'rgba(255,255,255,.28)'}" stroke-width="2.5"
            filter="url(#node-glow)"/>
          ${face}
          <text y="${NODE_R + 18}" text-anchor="middle" fill="#e2e8f5" font-size="12"
            font-weight="600" font-family="system-ui" pointer-events="none"
            stroke="#0f1117" stroke-width="3.5" paint-order="stroke">${eh((p.firstName || 'Unnamed').trim())}${genderMark ? ' ' + genderMark : ''}</text>
          ${p.lastName ? `<text y="${NODE_R + 32}" text-anchor="middle" fill="#8892a4"
            font-size="10.5" font-family="system-ui" pointer-events="none"
            stroke="#0f1117" stroke-width="3" paint-order="stroke">${eh(p.lastName.trim())}</text>` : ''}
        </g>
      </g>`;
    idx++;
  });

  document.getElementById('tree-g').innerHTML = svg;

  /* Event listeners */
  document.querySelectorAll('.t-node').forEach(el => {
    const pid = el.dataset.id;
    el.addEventListener('click', () => {
      if (S.highlight === pid) {
        /* Second tap: open full profile */
        S.highlight = null;
        treeRender();
        modalOpen({ personId: pid, mode: 'view' });
      } else {
        /* First tap: select — relatives light up, action card slides in */
        S.highlight = pid;
        treeRender();
      }
    });
  });

  treeCardUpdate();
}

/* Bottom action card for the selected person */
function treeCardUpdate() {
  const el = document.getElementById('tree-card');
  const p  = S.highlight ? S.data.people[S.highlight] : null;
  if (!p) { el.style.display = 'none'; el.innerHTML = ''; return; }
  const photo = p.photoId ? S.photos[p.photoId] : null;
  const init  = initials(p);
  const name  = [p.firstName, p.lastName].filter(Boolean).join(' ') || 'Unnamed';
  const sub   = [p.location, p.occupation].filter(Boolean).join(' · ');
  el.innerHTML = `
    <div class="tree-card-top">
      <div class="map-card-av" style="background:${photo ? '#1e2130' : personColor(p.id)}">
        ${photo ? `<img src="${photo}"/>` : `<span>${eh(init)}</span>`}
      </div>
      <div class="map-card-info">
        <div class="map-card-name">${eh(name)}</div>
        ${sub ? `<div class="map-card-sub">${eh(sub)}</div>` : ''}
      </div>
    </div>
    <div class="tree-card-btns">
      <button class="tree-card-btn primary" onclick="relPickerOpen('${p.id}')">➕ Add relative</button>
      <button class="tree-card-btn ghost" onclick="modalOpen({personId:'${p.id}',mode:'view'})">👤 Profile</button>
    </div>`;
  el.style.display = 'flex';
}

function treeFit() {
  const svg = document.getElementById('tree-svg');
  const g   = document.getElementById('tree-g');
  if (!g) return;
  try {
    const bbox = g.getBBox();
    if (!bbox.width || !bbox.height) return;
    const w = svg.clientWidth  || window.innerWidth;
    const h = svg.clientHeight || (window.innerHeight - 112);
    const pad = Math.min(60, w * 0.08);
    const scale = Math.min((w - pad*2) / bbox.width, (h - pad*2) / bbox.height, 1.5);
    const tx = w/2 - (bbox.x + bbox.width/2) * scale;
    const ty = h/2 - (bbox.y + bbox.height/2) * scale;
    d3.select('#tree-svg').transition().duration(500)
      .call(treeZoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  } catch {}
}

/* Fit if the whole tree stays readable; otherwise zoom to a readable level
   centered on focusId (or the middle of the tree) */
function treeHome(focusId) {
  const svg = document.getElementById('tree-svg');
  const g   = document.getElementById('tree-g');
  if (!g) return;
  try {
    const bbox = g.getBBox();
    if (!bbox.width || !bbox.height) return;
    const w = svg.clientWidth  || window.innerWidth;
    const h = svg.clientHeight || (window.innerHeight - 112);
    const pad = Math.min(60, w * 0.08);
    const fitScale = Math.min((w - pad*2) / bbox.width, (h - pad*2) / bbox.height, 1.5);
    if (fitScale >= 0.45) { treeFit(); return; }
    const k = 0.55;
    const f = (focusId && S._pos[focusId]) ? S._pos[focusId]
            : { x: bbox.x + bbox.width / 2, y: bbox.y + bbox.height / 2 };
    d3.select('#tree-svg').transition().duration(500)
      .call(treeZoom.transform, d3.zoomIdentity.translate(w/2 - f.x*k, h/2 - f.y*k).scale(k));
  } catch {}
}

function layoutRefresh() {
  S._pos = {};
  S._layoutDirty = true;
  treeRender();
  treeHome(S.highlight);
}

/* ═══════════════════════════════════════════════════════════════
   MAP VIEW
═══════════════════════════════════════════════════════════════ */
let leafMap, mapMarkerRefs = [], mapLines = [];
let mapCardScrollTimer = null, mapSuppressScroll = false;

function mapInit() {
  leafMap = L.map('leaflet-map', {
    center:[20,10], zoom:2, zoomControl:false, worldCopyJump:true
  });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a>',
    subdomains:'abcd', maxZoom:19
  }).addTo(leafMap);

  /* Swiping the carousel selects the centered card */
  document.getElementById('map-cards').addEventListener('scroll', () => {
    if (mapSuppressScroll) return;
    clearTimeout(mapCardScrollTimer);
    mapCardScrollTimer = setTimeout(mapCardScrollSettled, 130);
  });
}

function mapLocated() {
  return Object.values(S.data.people)
    .filter(p => p.lat != null && p.lng != null)
    .sort((a,b) => (a.firstName||'').localeCompare(b.firstName||''));
}

function mapGroupKey(p) { return p.lat.toFixed(3) + ',' + p.lng.toFixed(3); }

function mapRender() {
  const all     = Object.values(S.data.people);
  const located = mapLocated();
  const missing = all.length - located.length;

  /* Status chip: how many are on the map, tap to add more */
  const chip = document.getElementById('map-chip');
  chip.style.display = (located.length && missing > 0) ? 'flex' : 'none';
  chip.innerHTML = `<span class="chip-dot"></span>${located.length} of ${all.length} on the map · tap to add more`;

  /* Empty state + fit button */
  document.getElementById('map-empty').style.display = located.length ? 'none' : 'flex';
  document.getElementById('map-fit').style.display   = located.length ? 'flex' : 'none';

  /* Clear layers */
  mapMarkerRefs.forEach(r => r.marker.remove());
  mapMarkerRefs = [];
  mapClearLines();
  document.getElementById('map-legend').style.display = 'none';

  if (S.mapSel && !located.some(p => p.id === S.mapSel)) S.mapSel = null;

  /* Group people at identical coordinates (same city geocodes to one point) */
  const groups = new Map();
  located.forEach(p => {
    const key = mapGroupKey(p);
    if (!groups.has(key)) groups.set(key, { key, lat:p.lat, lng:p.lng, people:[] });
    groups.get(key).people.push(p);
  });

  let gi = 0;
  groups.forEach(g => {
    const lead  = g.people[0];
    const col   = personColor(lead.id);
    const photo = lead.photoId ? S.photos[lead.photoId] : null;
    const init  = initials(lead);
    const label = g.people.length > 1
      ? (lead.location ? lead.location.split(',')[0] : `${g.people.length} people`)
      : (lead.firstName || 'Unnamed');
    const selected = S.mapSel && g.people.some(p => p.id === S.mapSel);

    const html = `
      <div class="mk${selected ? ' mk-sel' : ''}" style="animation-delay:${Math.min(gi*45,450)}ms">
        <div class="mk-ring" style="--c:${col}">
          <div class="mk-av">${photo ? `<img src="${photo}"/>` : `<span>${eh(init)}</span>`}</div>
          ${g.people.length > 1 ? `<div class="mk-count">${g.people.length}</div>` : ''}
        </div>
        <div class="mk-name">${eh(label)}</div>
      </div>`;

    const marker = L.marker([g.lat, g.lng], {
      icon: L.divIcon({ html, className:'', iconSize:[100,80], iconAnchor:[50,26] })
    }).addTo(leafMap)
      .on('click', () => {
        if (g.people.length === 1) mapSelect(g.people[0].id);
        else mapPlaceSheetOpen(g.key);
      });
    mapMarkerRefs.push({ marker, ids: g.people.map(p => p.id) });
    gi++;
  });

  /* Bottom card carousel */
  const cardsEl = document.getElementById('map-cards');
  cardsEl.style.display = located.length ? 'flex' : 'none';
  cardsEl.innerHTML = located.map(p => {
    const photo = p.photoId ? S.photos[p.photoId] : null;
    const init  = initials(p);
    const name  = [p.firstName,p.lastName].filter(Boolean).join(' ') || 'Unnamed';
    const col   = personColor(p.id);
    return `<button class="map-card${p.id===S.mapSel?' sel':''}" data-id="${p.id}" onclick="mapCardTap('${p.id}')">
      <div class="map-card-av" style="background:${photo?'#1e2130':col}">
        ${photo ? `<img src="${photo}"/>` : `<span>${eh(init)}</span>`}
      </div>
      <div class="map-card-info">
        <div class="map-card-name">${eh(name)}</div>
        ${p.location   ? `<div class="map-card-sub">📍 ${eh(p.location)}</div>`   : ''}
        ${p.occupation ? `<div class="map-card-sub">💼 ${eh(p.occupation)}</div>` : ''}
        <div class="map-card-cta">Tap for profile ›</div>
      </div>
    </button>`;
  }).join('');

  setTimeout(() => {
    leafMap.invalidateSize();
    if (S.mapSel)            mapSelect(S.mapSel, { fly:true, scroll:true });
    else if (located.length) mapFitAll(false);
  }, 80);
}

function mapFitAll(animate = true) {
  const located = mapLocated();
  if (!located.length) return;
  leafMap.fitBounds(L.latLngBounds(located.map(p => [p.lat, p.lng])), {
    paddingTopLeft:[40,70], paddingBottomRight:[40,200], maxZoom:10, animate
  });
}

function mapSelect(id, opts = {}) {
  const p = S.data.people[id];
  if (!p || p.lat == null || p.lng == null) return;
  S.mapSel = id;

  /* Highlight the marker (pulse ring) */
  mapMarkerRefs.forEach(r => {
    const hit = r.ids.includes(id);
    const el  = r.marker.getElement()?.querySelector('.mk');
    if (el) el.classList.toggle('mk-sel', hit);
    r.marker.setZIndexOffset(hit ? 1000 : 0);
  });

  /* Highlight + center the card */
  const cardsEl = document.getElementById('map-cards');
  cardsEl.querySelectorAll('.map-card').forEach(c => c.classList.toggle('sel', c.dataset.id === id));
  if (opts.scroll !== false) {
    const card = cardsEl.querySelector(`.map-card[data-id="${id}"]`);
    if (card) {
      mapSuppressScroll = true;
      cardsEl.scrollTo({ left: card.offsetLeft - (cardsEl.clientWidth - card.offsetWidth)/2, behavior:'smooth' });
      setTimeout(() => { mapSuppressScroll = false; }, 650);
    }
  }

  mapDrawRelLines(id);

  if (opts.fly !== false) {
    /* Offset center downward so the marker sits above the carousel */
    const z  = Math.min(Math.max(leafMap.getZoom(), 6), 11);
    const pt = leafMap.project([p.lat, p.lng], z).add([0, 70]);
    leafMap.flyTo(leafMap.unproject(pt, z), z, { duration:.8 });
  }
}

function mapCardTap(id) {
  if (S.mapSel === id) modalOpen({ personId:id, mode:'view' });
  else mapSelect(id);
}

function mapCardScrollSettled() {
  const el = document.getElementById('map-cards');
  if (!el || S.view !== 'map') return;
  const center = el.scrollLeft + el.clientWidth/2;
  let best = null, bestD = Infinity;
  el.querySelectorAll('.map-card').forEach(c => {
    const d = Math.abs(c.offsetLeft + c.offsetWidth/2 - center);
    if (d < bestD) { bestD = d; best = c; }
  });
  if (best && best.dataset.id !== S.mapSel) mapSelect(best.dataset.id, { fly:true, scroll:false });
}

/* ── Relationship arcs from the selected person ── */
function mapClearLines() { mapLines.forEach(l => l.remove()); mapLines = []; }

function arcPoints(a, b) {
  /* Quadratic bezier in lat/lng space with a perpendicular bow */
  const mx = (a.lat + b.lat)/2, my = (a.lng + b.lng)/2;
  const dx = b.lat - a.lat,     dy = b.lng - a.lng;
  const cx = mx - dy * 0.18,    cy = my + dx * 0.18;
  const pts = [];
  for (let i = 0; i <= 48; i++) {
    const t = i/48;
    pts.push([
      (1-t)*(1-t)*a.lat + 2*(1-t)*t*cx + t*t*b.lat,
      (1-t)*(1-t)*a.lng + 2*(1-t)*t*cy + t*t*b.lng
    ]);
  }
  return pts;
}

function mapDrawRelLines(id) {
  mapClearLines();
  const legendEl = document.getElementById('map-legend');
  const p  = S.data.people[id];
  const hl = p ? computeHighlight(id) : null;
  if (!hl) { legendEl.style.display = 'none'; return; }

  const present = new Set();
  [['parent', hl.parents], ['child', hl.children], ['spouse', hl.spouses], ['sibling', hl.siblings]]
    .forEach(([type, set]) => {
      set.forEach(rid => {
        const r = S.data.people[rid];
        if (!r || r.lat == null || r.lng == null) return;
        if (Math.abs(r.lat - p.lat) < 1e-4 && Math.abs(r.lng - p.lng) < 1e-4) return;
        mapLines.push(L.polyline(
          arcPoints({lat:p.lat, lng:p.lng}, {lat:r.lat, lng:r.lng}),
          { color: RC[type], weight: 2.5, opacity: .85, dashArray: '2 7', lineCap: 'round' }
        ).addTo(leafMap));
        present.add(type);
      });
    });

  if (present.size) {
    const LBL = { parent:'Parent', child:'Child', spouse:'Spouse', sibling:'Sibling' };
    legendEl.innerHTML = [...present].map(t =>
      `<span class="legend-item"><span class="legend-line legend-dash" style="--c:${RC[t]}"></span>${LBL[t]}</span>`).join('');
    legendEl.style.display = 'flex';
  } else legendEl.style.display = 'none';
}

async function unmappedPick(id) {
  mapSheetClose();
  const p = S.data.people[id];
  if (!p) return;
  /* Has a location string but no coords: retry geocoding before asking to edit */
  if (p.location) {
    const coords = await geocode(p.location);
    if (coords) {
      p.lat = coords.lat; p.lng = coords.lng;
      S.mapSel = id;
      dataSave();
      mapRender();
      return;
    }
  }
  modalOpen({ personId:id, mode:'edit' });
}

function personPickerUpdateList() {
  const { contextId, relType, search } = S.personpick;
  const listEl = document.getElementById('picker-list');
  if (!listEl) return;
  const eligible = getEligiblePeople(contextId, relType);
  const term     = search.trim().toLowerCase();

    ? eligible.filter(p => [p.firstName,p.lastName,p.location,p.occupation]
        .some(f => f?.toLowerCase().includes(term)))
    : eligible;
  if (!filtered.length) {
    listEl.innerHTML = `<div class="picker-empty">${term ? 'No matches' : 'No eligible people to link'}</div>`;

  }
  const sorted = [...filtered].sort((a,b) => (a.firstName||'').localeCompare(b.firstName||''));
  listEl.innerHTML = sorted.map(p => {
    const col   = personColor(p.id);
    const photo = p.photoId ? S.photos[p.photoId] : null;
    const init  = initials(p);
    const name  = [p.firstName,p.lastName].filter(Boolean).join(' ') || 'Unnamed';
    const sub   = [p.occupation,p.location].filter(Boolean).join(' · ');
    const avStyle = photo
      ? `background:#1e2130;background-image:url('${photo}');background-size:cover;background-position:center`
      : `background:${col}`;
    return `
      <button class="picker-item" onclick="personPickerSelect('${p.id}')">
