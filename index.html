<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0f1117"/>
<title>Family Tree</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0f1117;color:#e0e6f0;
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ── App shell ── */
#app{display:flex;flex-direction:column;height:100%;height:100dvh}

#header{flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;height:52px;background:#12151f;border-bottom:1px solid #1e2538;z-index:10}
.header-title{font-size:18px;font-weight:700;color:#e0e6f0;letter-spacing:-.3px}
.header-right{display:flex;align-items:center;gap:10px}
#member-count{font-size:12px;color:#6b7a99}
#app-version{font-size:11px;color:#3d4a66;font-weight:600;letter-spacing:.3px;
  background:#1a1f2e;border:1px solid #1e2538;border-radius:6px;padding:3px 7px}
#btn-export{background:#1e2538;border:1px solid #2e3a56;color:#a0aec0;font-size:13px;
  padding:6px 12px;border-radius:8px;cursor:pointer;transition:background .15s}
#btn-export:hover{background:#2a3350}

#main{flex:1;overflow:hidden;position:relative}
#tree-view,#map-view{position:absolute;inset:0}

/* ── Tree ── */
#tree-svg{width:100%;height:100%;display:block;background:#0f1117;touch-action:none}

/* ── Map ── */
#leaflet-map{width:100%;height:100%}
#map-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  background:rgba(15,17,23,.9);border:1px solid #2e3a56;color:#8892a4;font-size:12px;
  padding:8px 14px;border-radius:20px;white-space:nowrap;pointer-events:none;
  backdrop-filter:blur(8px);z-index:1000}

/* ── Bottom nav ── */
#bottom-nav{flex:none;display:flex;background:#12151f;border-top:1px solid #1e2538;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:10px 8px;background:none;border:none;cursor:pointer;color:#4a5568;transition:color .15s}
.nav-btn.active{color:#4A90E2}
.nav-btn:hover{color:#718096}
.nav-icon{font-size:22px;line-height:1}
.nav-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* ── Modal overlay ── */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;
  display:flex;align-items:flex-end;backdrop-filter:blur(4px);animation:fade-in .2s ease}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

/* ── Modal sheet ── */
.modal-sheet{width:100%;max-width:560px;margin:0 auto;background:#12151f;
  border-radius:20px 20px 0 0;border-top:1px solid #2e3a56;max-height:92dvh;
  overflow-y:auto;overscroll-behavior:contain;animation:slide-up .28s cubic-bezier(.32,.72,0,1)}
@keyframes slide-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:#2e3a56;border-radius:2px;margin:12px auto 8px}

/* ── Photo section ── */
.photo-sec{display:flex;flex-direction:column;align-items:center;padding:12px 16px 8px;gap:10px}
.avatar{width:90px;height:90px;border-radius:50%;background:#1e2538 center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;border:3px solid #2e3a56;
  position:relative;overflow:hidden;flex-shrink:0}
.avatar-initials{font-size:32px;font-weight:700;color:#a0aec0;pointer-events:none}
.avatar-cam{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;
  align-items:center;justify-content:center;font-size:28px;opacity:0;transition:opacity .15s;cursor:pointer}
.avatar:hover .avatar-cam,.avatar:active .avatar-cam{opacity:1}
.photo-btns{display:flex;gap:8px}
.btn-photo,.btn-photo-rm{font-size:13px;padding:6px 14px;border-radius:8px;
  border:1px solid #2e3a56;cursor:pointer;transition:background .15s}
.btn-photo{background:#1e2538;color:#a0aec0}.btn-photo:hover{background:#2a3350}
.btn-photo-rm{background:transparent;color:#f87171;border-color:rgba(248,113,113,.3)}
.btn-photo-rm:hover{background:rgba(248,113,113,.1)}

/* ── Modal body ── */
.modal-body{padding:8px 20px 4px}
.view-name{margin:0 0 14px;font-size:22px;font-weight:700;color:#e0e6f0}
.view-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;
  border-bottom:1px solid #1e2538;color:#c0c8d8;font-size:15px}
.view-row:last-child{border-bottom:none}
.row-icon{font-size:18px;flex:none}
.phone-link{color:#4A90E2;text-decoration:none}
.phone-link:hover{text-decoration:underline}
.person-link{color:#4A90E2;cursor:pointer;background:none;border:none;font:inherit;
  font-size:15px;padding:0;text-align:left}
.person-link:hover{text-decoration:underline}
.no-details{color:#4a5568;font-size:14px;margin:0;padding:8px 0}
.section-sep{height:1px;background:#1e2538;margin:8px 0}
.rel-section-title{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;color:#4a5568;margin:12px 0 4px}

/* ── Edit form ── */
.form-stack{display:flex;flex-direction:column;gap:10px}
.form-pair{display:flex;gap:10px}
.add-ctx{font-size:13px;color:#6b7a99;background:#1a1f2e;border:1px solid #2e3a56;
  border-radius:8px;padding:8px 12px;margin-bottom:2px}
.add-ctx strong{color:#a0aec0}
input.field{width:100%;background:#1a1f2e;border:1px solid #2e3a56;border-radius:10px;
  padding:13px 14px;font-size:15px;color:#e0e6f0;outline:none;transition:border-color .15s;
  -webkit-appearance:none;font-family:inherit}
input.field::placeholder{color:#4a5568}
input.field:focus{border-color:#4A90E2;background:#1e2538}

/* ── Modal actions ── */
.modal-actions{display:flex;gap:10px;padding:16px 20px 4px}
.btn-save,.btn-edit,.btn-cancel,.btn-del{flex:1;padding:14px;border-radius:12px;
  font-size:16px;font-weight:600;border:none;cursor:pointer;transition:background .15s,opacity .15s}
.btn-save,.btn-edit{background:#4A90E2;color:#fff}
.btn-save:hover,.btn-edit:hover{background:#357abd}
.btn-save:disabled{opacity:.6;cursor:wait}
.btn-cancel{background:#1e2538;color:#a0aec0}.btn-cancel:hover{background:#2a3350}
.btn-cancel:disabled{opacity:.6}
.btn-del{flex:0 1 auto;padding:14px 20px;background:rgba(239,68,68,.15);
  color:#f87171;border:1px solid rgba(239,68,68,.3)}
.btn-del:hover{background:rgba(239,68,68,.25)}

/* ── Relationship picker ── */
#rel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;
  display:flex;align-items:flex-end;backdrop-filter:blur(4px);animation:fade-in .2s ease}
.rel-sheet{width:100%;max-width:560px;margin:0 auto;background:#12151f;
  border-radius:20px 20px 0 0;border-top:1px solid #2e3a56;
  animation:slide-up .28s cubic-bezier(.32,.72,0,1);
  padding-bottom:env(safe-area-inset-bottom,8px)}
.rel-title{font-size:15px;font-weight:600;color:#8892a4;text-align:center;
  padding:4px 20px 8px}
.rel-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 16px 12px}
.rel-btn{background:#1e2538;border:1px solid #2e3a56;border-radius:14px;
  padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;color:#c0c8d8;transition:background .15s,border-color .15s;width:100%}
.rel-btn:hover,.rel-btn:active{background:#2a3350;border-color:#4A90E2}
.rel-btn:disabled{opacity:.4;cursor:not-allowed}
.rel-btn-icon{font-size:28px;line-height:1}
.rel-btn-label{font-size:14px;font-weight:600}
.rel-btn-sub{font-size:11px;color:#4a5568}
.rel-cancel-btn{width:calc(100% - 32px);margin:0 16px 8px;padding:14px;background:#1e2538;
  border:none;border-radius:12px;font-size:16px;font-weight:600;color:#a0aec0;cursor:pointer}
.rel-cancel-btn:hover{background:#2a3350}

/* ── Link choice overlay (New vs Existing) ── */
#link-choice-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:310;
  display:flex;align-items:flex-end;backdrop-filter:blur(4px);animation:fade-in .2s ease}
.link-choice{display:flex;flex-direction:column;gap:10px;padding:4px 16px 12px}
.link-choice-btn{background:#1e2538;border:1px solid #2e3a56;border-radius:14px;
  padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;
  text-align:left;color:#c0c8d8;transition:background .15s,border-color .15s;width:100%}
.link-choice-btn:hover,.link-choice-btn:active{background:#2a3350;border-color:#4A90E2}
.link-choice-icon{font-size:28px;flex:none;line-height:1}
.link-choice-label{font-size:15px;font-weight:600;margin-bottom:2px}
.link-choice-sub{font-size:12px;color:#6b7a99}

/* ── Person picker overlay ── */
#person-picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:320;
  display:flex;align-items:flex-end;backdrop-filter:blur(4px);animation:fade-in .2s ease}
.person-picker-sheet{width:100%;max-width:560px;margin:0 auto;background:#12151f;
  border-radius:20px 20px 0 0;border-top:1px solid #2e3a56;
  animation:slide-up .28s cubic-bezier(.32,.72,0,1);
  max-height:80dvh;display:flex;flex-direction:column}
.picker-header{padding:4px 16px 12px;flex:none}
.picker-title{font-size:14px;color:#8892a4;text-align:center;padding:4px 0 10px}
.picker-title strong{color:#c0c8d8}
input.picker-search{width:100%}
#picker-list{overflow-y:auto;flex:1;overscroll-behavior:contain;
  padding-bottom:env(safe-area-inset-bottom,12px)}
.picker-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;
  background:none;border:none;border-bottom:1px solid #1a1f2e;cursor:pointer;
  text-align:left;transition:background .12s}
.picker-item:hover,.picker-item:active{background:#1a1f2e}
.picker-item:last-child{border-bottom:none}
.picker-item-avatar{width:44px;height:44px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.picker-item-avatar span{color:#fff;font-weight:700;font-size:16px;font-family:system-ui}
.picker-item-info{flex:1;min-width:0}
.picker-item-name{font-size:15px;font-weight:600;color:#e0e6f0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-item-sub{font-size:12px;color:#6b7a99;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-item-arrow{color:#4a5568;font-size:20px;flex:none}
.picker-empty{padding:32px 16px;text-align:center;color:#4a5568;font-size:14px}

/* ── Fit button ── */
#btn-fit{background:#1e2538;border:1px solid #2e3a56;color:#a0aec0;font-size:15px;
  padding:6px 10px;border-radius:8px;cursor:pointer;transition:background .15s;line-height:1}
#btn-fit:hover{background:#2a3350}

/* ── Leaflet overrides ── */
.leaflet-container{background:#1a1f2e}
.leaflet-popup-content-wrapper{background:#12151f;border:1px solid #2e3a56;
  border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.5);color:#e0e6f0}
.leaflet-popup-tip{background:#12151f}
.leaflet-popup-close-button{color:#6b7a99!important}
.leaflet-popup-content{margin:10px 14px}

/* ── Tap hint ── */
#tap-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  background:rgba(15,17,23,.85);border:1px solid #2e3a56;color:#6b7a99;font-size:11px;
  padding:5px 12px;border-radius:16px;pointer-events:none;white-space:nowrap;
  backdrop-filter:blur(6px);z-index:5;transition:opacity .3s}

/* ── Gender selector ── */
.gender-btn{flex:1;background:#1a1f2e;border:1px solid #2e3a56;border-radius:10px;
  padding:11px 8px;font-size:14px;font-weight:600;color:#6b7a99;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;font-family:inherit}
.gender-btn:hover{background:#1e2538;color:#a0aec0}
.gender-btn.gender-male{background:#1e3052;border-color:#3b82f6;color:#93c5fd}
.gender-btn.gender-female{background:#3d1030;border-color:#ec4899;color:#f9a8d4}
.gender-btn.gender-nonbinary{background:#2d1a50;border-color:#a855f7;color:#d8b4fe}

/* ── Refresh button ── */
#btn-refresh{background:#1e2538;border:1px solid #2e3a56;color:#a0aec0;font-size:15px;
  padding:6px 10px;border-radius:8px;cursor:pointer;transition:background .15s;line-height:1}
#btn-refresh:hover{background:#2a3350}

/* ── Search button ── */
#btn-search{background:#1e2538;border:1px solid #2e3a56;color:#a0aec0;font-size:15px;
  padding:6px 10px;border-radius:8px;cursor:pointer;transition:background .15s;line-height:1}
#btn-search:hover{background:#2a3350}

/* ── Search overlay ── */
#search-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:320;
  display:flex;align-items:flex-end;backdrop-filter:blur(4px);animation:fade-in .2s ease}
.search-sheet{width:100%;max-width:560px;margin:0 auto;background:#12151f;
  border-radius:20px 20px 0 0;border-top:1px solid #2e3a56;
  animation:slide-up .28s cubic-bezier(.32,.72,0,1);
  max-height:80dvh;display:flex;flex-direction:column}
#search-list{overflow-y:auto;flex:1;overscroll-behavior:contain;
  padding-bottom:env(safe-area-inset-bottom,12px)}
.search-empty{padding:32px 16px;text-align:center;color:#4a5568;font-size:14px}

/* ── Grandparent rows ── */
.ancestor-section{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;color:#4a5568;margin:8px 0 4px}

@media(min-width:560px){
  #search-overlay{align-items:center}
  .search-sheet{border-radius:20px;margin:auto;max-height:70dvh}
}

/* ── Rel picker section labels ── */
.rel-section-label{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;color:#4a5568;margin:10px 0 5px}

@media(min-width:560px){
  .modal-sheet{border-radius:20px;margin:auto;max-height:85dvh}
  #modal-overlay{align-items:center}
  .rel-sheet{border-radius:20px;margin:auto}
  #rel-overlay,#link-choice-overlay{align-items:center}
  #person-picker-overlay{align-items:center}
  .person-picker-sheet{border-radius:20px;margin:auto;max-height:70dvh}
}
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <span class="header-title">🌳 Family Tree</span>
    <div class="header-right">
      <span id="member-count"></span>
      <span id="app-version"></span>
      <button id="btn-search" title="Search people" onclick="searchOpen()">🔍</button>
      <button id="btn-refresh" title="Refresh layout">🔄</button>
      <button id="btn-fit" title="Fit tree to screen">⤢</button>
      <button id="btn-export">📤 Export</button>
    </div>
  </header>

  <main id="main">
    <div id="tree-view">
      <svg id="tree-svg">
        <defs id="tree-defs"></defs>
        <g id="tree-g"></g>
        <g id="tree-legend-fixed"></g>
      </svg>
      <div id="tap-hint">Tap a person to highlight relatives · Tap again to view details</div>
    </div>
    <div id="map-view" style="display:none">
      <div id="leaflet-map"></div>
      <div id="map-hint" style="display:none"></div>
    </div>
  </main>

  <nav id="bottom-nav">
    <button class="nav-btn active" data-view="tree">
      <span class="nav-icon">🌳</span>
      <span class="nav-label">Tree</span>
    </button>
    <button class="nav-btn" data-view="map">
      <span class="nav-icon">🗺️</span>
      <span class="nav-label">Map</span>
    </button>
    <button class="nav-btn" id="btn-import">
      <span class="nav-icon">📥</span>
      <span class="nav-label">Import</span>
    </button>
  </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════════════════════ */
const STORAGE_KEY = 'familytree_v2';
const APP_VERSION = 'v2.4';
const DB_NAME     = 'familytree_photos';
const DB_STORE    = 'photos';
const NODE_R      = 36;
const V_GAP       = 145;

/* Relationship colors */
const RC = {
  parent:  '#f97316',
  child:   '#22c55e',
  spouse:  '#ec4899',
  sibling: '#a855f7',
  self:    '#ffffff',
};

const COLORS = ['#4A90E2','#E67E22','#2ECC71','#9B59B6','#E74C3C','#1ABC9C','#F39C12','#e84393'];
const REL_LABELS = { child:'child', spouse:'spouse / partner', sibling:'sibling', parent:'parent' };
const REL_ICONS  = { child:'👶', spouse:'💑', sibling:'👫', parent:'👆' };

/* Sub-typed relationship keys — each maps to a base relType + default gender */
const REL_SUB = {
  son:     { type:'child',   gender:'male',   icon:'👦', label:'Son'     },
  daughter:{ type:'child',   gender:'female', icon:'👧', label:'Daughter'},
  husband: { type:'spouse',  gender:'male',   icon:'🤵', label:'Husband' },
  wife:    { type:'spouse',  gender:'female', icon:'👰', label:'Wife'    },
  father:  { type:'parent',  gender:'male',   icon:'👨', label:'Father'  },
  mother:  { type:'parent',  gender:'female', icon:'👩', label:'Mother'  },
  brother: { type:'sibling', gender:'male',   icon:'👦', label:'Brother' },
  sister:  { type:'sibling', gender:'female', icon:'👧', label:'Sister'  },
};

/* ═══════════════════════════════════════════════════════════════
   APP STATE
═══════════════════════════════════════════════════════════════ */
const S = {
  data:       null,
  photos:     {},
  view:       'tree',
  modal:      null,
  relpick:    null,
  linkpick:   null,
  personpick: null,
  search:     null,
  highlight:  null,  // id of currently highlighted person
  _pos:       {},    // cached node positions {id: {x,y}}
  _layoutDirty: true,
};

/* ═══════════════════════════════════════════════════════════════
   BOOTSTRAP
═══════════════════════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', async () => {
  S.data = dataLoad();
  await photosLoadAll();
  treeInit();
  mapInit();
  treeRender();
  headerUpdate();
  navSetup();
  document.getElementById('app-version').textContent = APP_VERSION;
  document.getElementById('btn-export').addEventListener('click', doExport);
  document.getElementById('btn-import').addEventListener('click', doImportClick);
  document.getElementById('btn-fit').addEventListener('click', treeFit);
  document.getElementById('btn-refresh').addEventListener('click', layoutRefresh);

  /* Clear highlight when tapping the SVG background */
  document.getElementById('tree-svg').addEventListener('click', e => {
    if (e.target === document.getElementById('tree-svg') ||
        e.target === document.getElementById('tree-g')) {
      if (S.highlight) { S.highlight = null; treeRender(); }
    }
  });

  /* Hide tap hint after first interaction */
  document.getElementById('tree-svg').addEventListener('click', () => {
    const h = document.getElementById('tap-hint');
    if (h) { h.style.opacity = '0'; setTimeout(() => h.remove(), 300); }
  }, { once: true });
});

/* ═══════════════════════════════════════════════════════════════
   MIGRATION  (v1 parentId/virtual  →  v2 parents[]/links[])
═══════════════════════════════════════════════════════════════ */
function migrateData(d) {
  if (!d || !d.people) return;
  if (d.links !== undefined) {
    /* Already v2: ensure every person has parents[] */
    Object.values(d.people).forEach(p => {
      if (!Array.isArray(p.parents)) p.parents = [];
      if (!Array.isArray(p.children)) p.children = [];
      if (p.spouseId === undefined) p.spouseId = null;
      if (p.gender   === undefined) p.gender = '';
      delete p.virtual; delete p.parentId;
    });
    return;
  }

  const people = d.people;
  const virtualIds = new Set(Object.values(people).filter(p => p.virtual).map(p => p.id));

  /* Step 1: assign parents[] to real people */
  Object.values(people).forEach(p => {
    if (p.virtual) return;
    if (!p.parentId || virtualIds.has(p.parentId)) {
      /* parentId points at a virtual node: go one level up */
      const vp = p.parentId ? people[p.parentId] : null;
      p.parents = (vp && vp.parentId && !virtualIds.has(vp.parentId)) ? [vp.parentId] : [];
    } else {
      p.parents = [p.parentId];
    }
  });

  /* Step 2: fix children[] on real nodes (remove virtual IDs, flatten) */
  Object.values(people).forEach(p => {
    if (p.virtual) return;
    const fixed = [];
    (p.children || []).forEach(cid => {
      if (!virtualIds.has(cid)) { fixed.push(cid); return; }
      const vp = people[cid];
      if (vp) (vp.children || []).filter(c => !virtualIds.has(c)).forEach(c => fixed.push(c));
    });
    p.children = [...new Set(fixed)];
  });

  /* Step 3: fix rootId */
  while (d.rootId && virtualIds.has(d.rootId)) {
    const vp = people[d.rootId];
    const real = (vp?.children || []).find(c => !virtualIds.has(c));
    d.rootId = real || Object.keys(people).find(id => !virtualIds.has(id)) || d.rootId;
    break;
  }

  /* Step 4: delete virtual nodes and old fields */
  virtualIds.forEach(id => delete people[id]);
  Object.values(people).forEach(p => { delete p.parentId; delete p.virtual; });

  d.links = [];
}

function dataLoad() {

/* ═══════════════════════════════════════════════════════════════
   INDEXEDDB — photos
═══════════════════════════════════════════════════════════════ */
function dbOpen() {
  return new Promise((ok, fail) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
    req.onsuccess = () => ok(req.result);
    req.onerror   = () => fail(req.error);
  });
}

async function photosLoadAll() {
  const ids = Object.values(S.data.people).filter(p => p.photoId).map(p => p.photoId);
  if (!ids.length) return;
  try {
    const db = await dbOpen();
    await Promise.all(ids.map(id => new Promise(res => {
      const r = db.transaction(DB_STORE).objectStore(DB_STORE).get(id);
      r.onsuccess = () => { if (r.result) S.photos[id] = r.result; res(); };
      r.onerror   = () => res();
    })));
  } catch {}
}

async function photoStore(id, dataUrl) {
  try {
    const db = await dbOpen();
    await new Promise((ok, fail) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(dataUrl, id);
      tx.oncomplete = ok; tx.onerror = fail;
    });
  } catch {}
}

async function photoDelete(id) {
  if (!id) return;
  try {
    const db = await dbOpen();
    await new Promise((ok, fail) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(id);
      tx.oncomplete = ok; tx.onerror = fail;
    });
  } catch {}
}

async function photoCompress(file) {
  return new Promise(res => {
    const img = new Image();
    const blobUrl = URL.createObjectURL(file);
    img.onload = () => {
      const sz = 240, c = document.createElement('canvas');
      c.width = c.height = sz;
      const ctx = c.getContext('2d');
      const min = Math.min(img.naturalWidth, img.naturalHeight);
      ctx.drawImage(img, (img.naturalWidth-min)/2, (img.naturalHeight-min)/2, min, min, 0, 0, sz, sz);
      URL.revokeObjectURL(blobUrl);
      res(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => { URL.revokeObjectURL(blobUrl); res(null); };
    img.src = blobUrl;
  });
}

/* ═══════════════════════════════════════════════════════════════
   GEOCODING
═══════════════════════════════════════════════════════════════ */
const geoCache = new Map();
async function geocode(str) {
  if (!str?.trim()) return null;
  const key = str.trim().toLowerCase();
  if (geoCache.has(key)) return geoCache.get(key);
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(str)}&format=json&limit=1`,
      { headers: {'Accept-Language':'en-US,en'} }
    );
    const data = await r.json();
    if (data?.[0]) {
      const coords = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      geoCache.set(key, coords);
      return coords;
    }
  } catch {}
  return null;
}

/* ═══════════════════════════════════════════════════════════════
   CRUD
═══════════════════════════════════════════════════════════════ */
function mkPerson(id, parents, fields) {
  return {
    id,
    parents:    parents || [],
    children:   [],
    spouseId:   null,
    firstName:  '',
    lastName:   '',
    gender:     '',
    location:   '',
    lat:        null,
    lng:        null,
    occupation: '',
    phone:      '',
    photoId:    null,
    ...fields
  };
}

function personAddRel(contextId, relType, fields) {
  const id  = uid();
  const ctx = S.data.people[contextId];
  if (!ctx) return null;

  if (relType === 'child') {
    const parents = [contextId];
    /* Smart: auto-add spouse as co-parent */
    if (ctx.spouseId && S.data.people[ctx.spouseId]) {
      parents.push(ctx.spouseId);
      S.data.people[ctx.spouseId].children.push(id);
    }
    S.data.people[id] = mkPerson(id, parents, fields);
    ctx.children.push(id);

  } else if (relType === 'spouse') {
    if (ctx.spouseId) return null;
    S.data.people[id] = mkPerson(id, [], { ...fields, spouseId: contextId });
    ctx.spouseId = id;

  } else if (relType === 'sibling') {
    S.data.people[id] = mkPerson(id, [...(ctx.parents || [])], fields);
    /* Add to all shared parents' children lists */
    (ctx.parents || []).forEach(pid => {
      const par = S.data.people[pid];
      if (par && !par.children.includes(id)) par.children.push(id);
    });
    /* No shared parent: create explicit sibling link */
    if (!ctx.parents.length) {
      S.data.links.push({ type: 'sibling', a: contextId, b: id });
    }

  } else if (relType === 'parent') {
    S.data.people[id] = mkPerson(id, [], { ...fields, children: [contextId] });
    if (!ctx.parents.includes(id)) ctx.parents.push(id);
    if (contextId === S.data.rootId) S.data.rootId = id;
  }

  S._pos = {};
  S._layoutDirty = true;
  return id;
}

function personUpdate(id, fields) { Object.assign(S.data.people[id], fields); }

function removeFromParents(id) {
  const p = S.data.people[id]; if (!p) return;
  (p.parents || []).forEach(pid => {
    const par = S.data.people[pid];
    if (par) par.children = par.children.filter(c => c !== id);
  });
  p.parents = [];
  S.data.links = (S.data.links || []).filter(l => l.a !== id && l.b !== id);
}

function personDelete(id) {
  function sweep(pid) {
    const p = S.data.people[pid]; if (!p) return;
    if (p.spouseId && S.data.people[p.spouseId]) S.data.people[p.spouseId].spouseId = null;
    (p.parents || []).forEach(parentId => {
      const par = S.data.people[parentId];
      if (par) par.children = par.children.filter(c => c !== pid);
    });
    S.data.links = (S.data.links || []).filter(l => l.a !== pid && l.b !== pid);
    const kids = [...(p.children || [])];
    delete S.data.people[pid];
    kids.forEach(sweep);
  }

  const p = S.data.people[id]; if (!p) return;
  if (id === S.data.rootId) {
    const newRoot = (p.children || [])[0]
      || Object.keys(S.data.people).find(k => k !== id)
      || null;
    if (newRoot) S.data.rootId = newRoot;
  }
  sweep(id);

  if (!S.data.people[S.data.rootId]) {
    const remaining = Object.keys(S.data.people);
    if (remaining.length) {
      S.data.rootId = remaining[0];
    } else {
      const nid = uid();
      S.data.rootId = nid;
      S.data.people[nid] = mkPerson(nid, [], { firstName: 'You' });
    }
  }
  S._pos = {};
  S._layoutDirty = true;
}

function getAncestors(id) {
  const result = new Set();
  const queue  = [...(S.data.people[id]?.parents || [])];
  while (queue.length) {
    const pid = queue.shift();
    if (result.has(pid)) continue;
    result.add(pid);
    const p = S.data.people[pid];
    if (p) (p.parents || []).forEach(gid => { if (!result.has(gid)) queue.push(gid); });
  }
  return result;
}

function getDescendants(id) {
  const result = new Set();
  function walk(pid) {
    const p = S.data.people[pid]; if (!p) return;
    (p.children || []).forEach(cid => { result.add(cid); walk(cid); });
  }
  walk(id);
  return result;
}

function getEligiblePeople(contextId, relType) {
  const ctx = S.data.people[contextId];
  if (!ctx) return [];
  const ancestors   = getAncestors(contextId);
  const descendants = getDescendants(contextId);
  const ctxSibIds   = new Set(
    (ctx.parents || []).flatMap(pid => (S.data.people[pid]?.children || []))
      .filter(c => c !== contextId)
  );

  return Object.values(S.data.people).filter(p => {
    if (p.id === contextId) return false;
    if (relType === 'spouse')  return !ctx.spouseId && !p.spouseId;
    if (relType === 'child')   return !ancestors.has(p.id) && !(ctx.children||[]).includes(p.id);
    if (relType === 'parent')  return !descendants.has(p.id) && !(ctx.parents||[]).includes(p.id);
    if (relType === 'sibling') return !ctxSibIds.has(p.id);
    return true;
  });
}

function linkExisting(contextId, relType, targetId) {
  const ctx = S.data.people[contextId];
  const tgt = S.data.people[targetId];
  if (!ctx || !tgt || contextId === targetId) return;

  if (relType === 'spouse') {
    if (ctx.spouseId || tgt.spouseId) return;
    ctx.spouseId = targetId;
    tgt.spouseId = contextId;

  } else if (relType === 'child') {
    if (getAncestors(contextId).has(targetId)) {
      alert('Cannot add: this would create a circular relationship.'); return;
    }
    removeFromParents(targetId);
    if (!tgt.parents.includes(contextId)) tgt.parents.push(contextId);
    /* Auto-add spouse as co-parent */
    if (ctx.spouseId && S.data.people[ctx.spouseId] && !tgt.parents.includes(ctx.spouseId)) {
      tgt.parents.push(ctx.spouseId);
      const sp = S.data.people[ctx.spouseId];
      if (!sp.children.includes(targetId)) sp.children.push(targetId);
    }
    if (!ctx.children.includes(targetId)) ctx.children.push(targetId);
    if (S.data.rootId === targetId) S.data.rootId = contextId;

  } else if (relType === 'sibling') {
    removeFromParents(targetId);
    tgt.parents = [...(ctx.parents || [])];
    tgt.parents.forEach(pid => {
      const par = S.data.people[pid];
      if (par && !par.children.includes(targetId)) par.children.push(targetId);
    });
    if (!tgt.parents.length) {
      const already = (S.data.links || []).some(l =>
        l.type === 'sibling' &&
        ((l.a === contextId && l.b === targetId) || (l.a === targetId && l.b === contextId))
      );
      if (!already) S.data.links.push({ type: 'sibling', a: contextId, b: targetId });
    }

  } else if (relType === 'parent') {
    if (getDescendants(contextId).has(targetId)) {
      alert('Cannot add: this would create a circular relationship.'); return;
    }
    if (!ctx.parents.includes(targetId)) ctx.parents.push(targetId);
    if (!tgt.children.includes(contextId)) tgt.children.push(contextId);
    if (S.data.rootId === contextId) S.data.rootId = targetId;
  }

  S._pos = {};
  S._layoutDirty = true;
  dataSave();
  treeRender();
  headerUpdate();
  treeFit();
}

/* ═══════════════════════════════════════════════════════════════
   COLOR HELPER (for map markers)
═══════════════════════════════════════════════════════════════ */
function personColor(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) & 0xfffffff;
  return COLORS[h % COLORS.length];
}

/* ═══════════════════════════════════════════════════════════════
   TREE VIEW
═══════════════════════════════════════════════════════════════ */
let treeZoom;

function treeInit() {
  const svg = d3.select('#tree-svg');
  treeZoom = d3.zoom().scaleExtent([0.08, 4])
    .on('zoom', ({ transform }) => d3.select('#tree-g').attr('transform', transform));
  svg.call(treeZoom);
  const svgEl = document.getElementById('tree-svg');
  const w = svgEl.clientWidth || window.innerWidth;
  const h = svgEl.clientHeight || (window.innerHeight - 112);
  svg.call(treeZoom.transform, d3.zoomIdentity.translate(w / 2, h * 0.35));
}

/* BFS generation assignment */
function assignGenerations() {
  const people = S.data.people;
  const gen    = {};
  const queue  = [{ id: S.data.rootId, g: 0 }];
  const visited = new Set();

  while (queue.length) {
    const { id, g } = queue.shift();
    if (visited.has(id) || !people[id]) continue;
    visited.add(id);
    gen[id] = g;
    const p = people[id];
    if (p.spouseId && !visited.has(p.spouseId))
      queue.push({ id: p.spouseId, g });
    (p.children || []).forEach(c => { if (!visited.has(c)) queue.push({ id: c, g: g + 1 }); });
    (p.parents  || []).forEach(par => { if (!visited.has(par)) queue.push({ id: par, g: g - 1 }); });
  }
  /* Handle disconnected people */
  Object.keys(people).forEach(id => { if (!(id in gen)) gen[id] = 0; });
  return gen;
}

/* Force-simulation layout. Returns nodeById map. Caches to S._pos. */
function layoutNodes(gen) {
  const people = S.data.people;
  const ids    = Object.keys(people);
  if (!ids.length) return {};

  const nodes = ids.map(id => {
    const p   = people[id];
    const g   = gen[id] ?? 0;
    const cached = S._pos[id];
    let ix, iy = g * V_GAP;
    if (cached) {
      ix = cached.x;
    } else {
      /* Smart seed: average parent X, or near spouse, or spread by index */
      const parXs = (p.parents || []).filter(pid => S._pos[pid]).map(pid => S._pos[pid].x);
      if (parXs.length) {
        ix = parXs.reduce((a,b)=>a+b,0) / parXs.length;
      } else if (p.spouseId && S._pos[p.spouseId]) {
        ix = S._pos[p.spouseId].x + NODE_R * 2.8;
      } else {
        ix = (Math.random() - 0.5) * Math.max(ids.length * 90, 300);
      }
    }
    return { id, gen: g, x: ix, y: iy };
  });

  const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));

  const spouseLinks   = [];
  const parentLinks   = [];
  const coParentLinks = [];
  const seenSp = new Set();
  const seenCp = new Set();

  ids.forEach(id => {
    const p = people[id];
    if (p.spouseId && nodeById[p.spouseId] && !seenSp.has(id + p.spouseId)) {
      spouseLinks.push({ source: nodeById[id], target: nodeById[p.spouseId] });
      seenSp.add(id + p.spouseId); seenSp.add(p.spouseId + id);
    }
    (p.children || []).forEach(cid => {
      if (nodeById[cid]) parentLinks.push({ source: nodeById[id], target: nodeById[cid] });
    });
  });

  /* Co-parent links: keep parents of shared children together even if not spouses */
  ids.forEach(id => {
    const p = people[id];
    (p.children || []).forEach(cid => {
      (people[cid]?.parents || []).forEach(otherId => {
        if (otherId === id || p.spouseId === otherId) return;
        const key = [id, otherId].sort().join('|');
        if (seenCp.has(key) || !nodeById[otherId]) return;
        seenCp.add(key);
        coParentLinks.push({ source: nodeById[id], target: nodeById[otherId] });
      });
    });
  });

  const hasCached = ids.some(id => S._pos[id]);
  d3.forceSimulation(nodes)
    .force('y',        d3.forceY(d => d.gen * V_GAP).strength(1.0))
    .force('x',        d3.forceX(0).strength(0.03))
    .force('collide',  d3.forceCollide(NODE_R * 2.3).strength(0.7))
    .force('spouse',   d3.forceLink(spouseLinks).distance(NODE_R * 2 + 8).strength(0.99))
    .force('coparent', d3.forceLink(coParentLinks).distance(NODE_R * 2 + 8).strength(0.55))
    .force('parent',   d3.forceLink(parentLinks).distance(V_GAP * 0.72).strength(0.18))
    .alphaDecay(0.022)
    .stop()
    .tick(hasCached ? 300 : 500);

  nodes.forEach(n => { S._pos[n.id] = { x: n.x, y: n.y }; });
  return nodeById;
}

/* Compute which nodes are highlighted relatives of `id` */
function computeHighlight(id) {
  const p = S.data.people[id];
  if (!p) return null;
  const h = {
    self:     new Set([id]),
    parents:  new Set(p.parents || []),
    children: new Set(p.children || []),
    spouses:  new Set(),
    siblings: new Set(),
  };
  if (p.spouseId) h.spouses.add(p.spouseId);
  (p.parents || []).forEach(pid => {
    (S.data.people[pid]?.children || []).filter(c => c !== id).forEach(c => h.siblings.add(c));
  });
  (S.data.links || []).forEach(lk => {
    if (lk.type !== 'sibling') return;
    if (lk.a === id) h.siblings.add(lk.b);
    if (lk.b === id) h.siblings.add(lk.a);
  });
  return h;
}

function treeRender() {
  const people = S.data.people;
  const ids    = Object.keys(people);
  if (!ids.length) return;

  /* Re-run layout only when data changed */
  const gen      = assignGenerations();
  const nodeById = S._layoutDirty ? layoutNodes(gen) : (() => {
    /* Rebuild nodeById from cached positions */
    const nb = {};
    ids.forEach(id => {
      if (!S._pos[id]) { S._layoutDirty = true; }
      nb[id] = { id, gen: gen[id] ?? 0, x: (S._pos[id] || {}).x || 0, y: (S._pos[id] || {}).y || 0 };
    });
    if (S._layoutDirty) return layoutNodes(gen);
    return nb;
  })();
  S._layoutDirty = false;

  /* Clip paths for photos */
  document.getElementById('tree-defs').innerHTML = ids
    .filter(id => people[id].photoId && S.photos[people[id].photoId])
    .map(id => `<clipPath id="cp-${id}"><circle r="${NODE_R}"/></clipPath>`)
    .join('');

  const hl = S.highlight ? computeHighlight(S.highlight) : null;

  /* ── LINKS ── */
  let svg = '';

  /* Spouse links */
  const seenSp = new Set();
  ids.forEach(id => {
    const p = people[id];
    if (!p.spouseId || seenSp.has(id)) return;
    const n1 = nodeById[id], n2 = nodeById[p.spouseId];
    if (!n1 || !n2) return;
    seenSp.add(id); seenSp.add(p.spouseId);
    const mx = (n1.x + n2.x) / 2, my = (n1.y + n2.y) / 2;
    svg += `<line x1="${n1.x}" y1="${n1.y}" x2="${n2.x}" y2="${n2.y}"
      stroke="${RC.spouse}" stroke-width="2.5" stroke-dasharray="6,4" stroke-linecap="round"/>`;
    svg += `<text x="${mx}" y="${my}" text-anchor="middle" dominant-baseline="central"
      font-size="14" font-family="system-ui" fill="${RC.spouse}"
      stroke="#0f1117" stroke-width="3" paint-order="stroke">♥</text>`;
  });

  /* Parent → child connections */
  const drawnBus = new Set();
  ids.forEach(id => {
    const p = people[id];
    const src = nodeById[id]; if (!src) return;
    const children = (p.children || []).filter(c => nodeById[c]);
    if (!children.length) return;

    const spouseNode = p.spouseId ? nodeById[p.spouseId] : null;

    /* Shared children (both parents present) */
    const sharedKids = spouseNode ? children.filter(cid =>
      (people[cid]?.parents || []).includes(p.spouseId)
    ) : [];
    const soleKids = children.filter(c => !sharedKids.includes(c));

    /* Bus-bar for couple's shared children */
    if (sharedKids.length && spouseNode) {
      const pairKey = [id, p.spouseId].sort().join('|');
      if (!drawnBus.has(pairKey)) {
        drawnBus.add(pairKey);
        const midX  = (src.x + spouseNode.x) / 2;
        const dropY = src.y + V_GAP * 0.40;
        const childNodes = sharedKids.map(c => nodeById[c]).filter(Boolean);
        const xs = childNodes.map(c => c.x);
        const minX = Math.min(...xs), maxX = Math.max(...xs);

        svg += `<line x1="${midX}" y1="${src.y + NODE_R + 2}" x2="${midX}" y2="${dropY}"
          stroke="${RC.parent}" stroke-width="2.5" stroke-linecap="round"/>`;
        if (childNodes.length > 1) {
          svg += `<line x1="${minX}" y1="${dropY}" x2="${maxX}" y2="${dropY}"
            stroke="${RC.parent}" stroke-width="2.5"/>`;
        }
        childNodes.forEach(cn => {
          svg += `<line x1="${cn.x}" y1="${dropY}" x2="${cn.x}" y2="${cn.y - NODE_R - 2}"
            stroke="${RC.parent}" stroke-width="2.5" stroke-linecap="round"/>`;
        });
      }
    }

    /* Elbow for sole-parent children */
    soleKids.forEach(cid => {
      const cn = nodeById[cid]; if (!cn) return;
      const midY = (src.y + cn.y) / 2;
      svg += `<path d="M${src.x},${src.y + NODE_R + 2} V${midY} H${cn.x} V${cn.y - NODE_R - 2}"
        fill="none" stroke="${RC.parent}" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>`;
    });
  });

  /* Explicit sibling links (no shared parent) */
  (S.data.links || []).forEach(lk => {
    if (lk.type !== 'sibling') return;
    const n1 = nodeById[lk.a], n2 = nodeById[lk.b];
    if (!n1 || !n2) return;
    const cp = Math.abs(n2.y - n1.y) * 0.45 + 30;
    svg += `<path d="M${n1.x},${n1.y} C${n1.x},${n1.y + cp} ${n2.x},${n2.y - cp} ${n2.x},${n2.y}"
      fill="none" stroke="${RC.sibling}" stroke-width="2" stroke-dasharray="5,4"/>`;
  });

  /* ── NODES ── */
  ids.forEach(id => {
    const p  = people[id];
    const n  = nodeById[id]; if (!n) return;
    const photo = p.photoId ? S.photos[p.photoId] : null;
    const init  = ((p.firstName || '')[0] + (p.lastName || '')[0]).toUpperCase() || '?';
    const name  = [p.firstName, p.lastName].filter(Boolean).join(' ') || 'Unnamed';
    const loc   = p.location ? p.location.split(',')[0] : '';
    const isRoot = id === S.data.rootId;

    /* Highlight ring */
    let ringColor = 'none';
    let nodeOpacity = 1;
    if (hl) {
      if (hl.self.has(id))          ringColor = RC.self;
      else if (hl.parents.has(id))  ringColor = RC.parent;
      else if (hl.children.has(id)) ringColor = RC.child;
      else if (hl.spouses.has(id))  ringColor = RC.spouse;
      else if (hl.siblings.has(id)) ringColor = RC.sibling;
      else nodeOpacity = 0.22;
    }

    const genderFill  = { male:'#2563eb', female:'#be185d', nonbinary:'#7c3aed' };
    const baseColor   = isRoot ? '#6366f1' : (genderFill[p.gender] || '#4A90E2');
    const genderMark  = { male:'♂', female:'♀', nonbinary:'⚧' }[p.gender] || '';
    const face = photo
      ? `<image href="${photo}" x="${-NODE_R}" y="${-NODE_R}"
           width="${NODE_R*2}" height="${NODE_R*2}"
           clip-path="url(#cp-${id})" preserveAspectRatio="xMidYMid slice"/>`
      : `<text text-anchor="middle" dominant-baseline="central" fill="white"
           font-size="${(NODE_R*.55)|0}" font-weight="700" font-family="system-ui"
           pointer-events="none">${eh(init)}</text>`;

    svg += `
      <g class="t-node" data-id="${id}" transform="translate(${n.x},${n.y})"
         style="opacity:${nodeOpacity};cursor:pointer">
        <circle class="h-ring" r="${NODE_R + 7}" fill="none"
          stroke="${ringColor}" stroke-width="3.5" pointer-events="none"/>
        <circle r="${NODE_R + 5}" fill="transparent"/>
        <circle r="${NODE_R}" fill="${photo ? '#1e2130' : baseColor}"
          stroke="${isRoot ? '#818cf8' : baseColor}" stroke-width="2.5"/>
        ${face}
        <text y="${NODE_R + 17}" text-anchor="middle" fill="#c9d1e0" font-size="12"
          font-weight="500" font-family="system-ui" pointer-events="none">${eh(name)}${genderMark ? ' ' + genderMark : ''}</text>
        ${loc ? `<text y="${NODE_R + 30}" text-anchor="middle" fill="#6b7a99"
          font-size="10" font-family="system-ui" pointer-events="none">${eh(loc)}</text>` : ''}
        <g class="add-rel" data-person="${id}" transform="translate(${NODE_R - 5},${-NODE_R + 5})">
          <circle r="13" fill="#10b981" stroke="#0f1117" stroke-width="2"/>
          <text text-anchor="middle" dominant-baseline="central" fill="white"
            font-size="19" font-weight="700" font-family="system-ui" dy="1"
            pointer-events="none">+</text>
        </g>
      </g>`;
  });

  document.getElementById('tree-g').innerHTML = svg;

  /* Event listeners */
  document.querySelectorAll('.t-node').forEach(el => {
    const pid = el.dataset.id;
    el.addEventListener('click', e => {
      if (e.target.closest('.add-rel')) return;
      if (S.highlight === pid) {
        /* Second tap: open detail modal */
        S.highlight = null;
        treeRender();
        modalOpen({ personId: pid, mode: 'view' });
      } else {
        /* First tap: highlight */
        S.highlight = pid;
        treeRender();
      }
    });
    const btn = el.querySelector('.add-rel');
    if (btn) btn.addEventListener('click', e => {
      e.stopPropagation();
      relPickerOpen(btn.dataset.person);
    });
  });

  /* Legend — horizontal bar fixed at bottom of SVG */
  const svgEl2 = document.getElementById('tree-svg');
  const svgW = svgEl2.clientWidth  || window.innerWidth;
  const svgH = svgEl2.clientHeight || (window.innerHeight - 112);
  const hItems = [
    { color: RC.parent,  label: 'Parent-Child', dashed: false },
    { color: RC.spouse,  label: 'Spouse',        dashed: true,  sym: '♥' },
    { color: RC.sibling, label: 'Sibling',       dashed: true },
  ];
  const iW = 112, hPad = 12;
  const barW = hItems.length * iW + hPad * 2;
  const bx = Math.max(8, (svgW - barW) / 2);
  const by = svgH - 36;
  let hLeg = `<rect x="${bx-hPad}" y="${by-8}" width="${barW+hPad}" height="28" rx="7"
    fill="#0a0d14" fill-opacity="0.88" stroke="#1e2538" pointer-events="none"/>`;
  hItems.forEach((it, i) => {
    const x = bx + i * iW, y = by + 6;
    hLeg += `<line x1="${x}" y1="${y}" x2="${x+22}" y2="${y}" stroke="${it.color}"
        stroke-width="2.5" ${it.dashed?'stroke-dasharray="5,3"':''} stroke-linecap="round"
        pointer-events="none"/>
      ${it.sym ? `<text x="${x+11}" y="${y}" text-anchor="middle" dominant-baseline="middle"
        fill="${it.color}" font-size="10" font-family="system-ui" pointer-events="none">${it.sym}</text>` : ''}
      <text x="${x+28}" y="${y}" dominant-baseline="middle" fill="#6b7a99"
        font-size="11" font-family="system-ui" pointer-events="none">${it.label}</text>`;
  });
  document.getElementById('tree-legend-fixed').innerHTML = hLeg;
}

function treeFit() {
  const svg = document.getElementById('tree-svg');
  const g   = document.getElementById('tree-g');
  if (!g) return;
  try {
    const bbox = g.getBBox();
    if (!bbox.width || !bbox.height) return;
    const w = svg.clientWidth  || window.innerWidth;
    const h = svg.clientHeight || (window.innerHeight - 112);
    const pad = 80;
    const scale = Math.min((w - pad*2) / bbox.width, (h - pad*2) / bbox.height, 1.5);
    const tx = w/2 - (bbox.x + bbox.width/2) * scale;
    const ty = h/2 - (bbox.y + bbox.height/2) * scale;
    d3.select('#tree-svg').transition().duration(500)
      .call(treeZoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  } catch {}
}

function layoutRefresh() {
  S._pos = {};
  S._layoutDirty = true;
  treeRender();
  treeFit();
}

/* ═══════════════════════════════════════════════════════════════
   MAP VIEW
═══════════════════════════════════════════════════════════════ */
let leafMap, leafMarkers = [];

function mapInit() {
  leafMap = L.map('leaflet-map', { center:[20,10], zoom:2 });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© <a href="https://openstreetmap.org">OpenStreetMap</a>', maxZoom:19
  }).addTo(leafMap);
}

function mapRender() {
  leafMarkers.forEach(m => m.remove());
  leafMarkers = [];

  const all     = Object.values(S.data.people);
  const located = all.filter(p => p.lat && p.lng);
  const hint    = document.getElementById('map-hint');
  const missing = all.length - located.length;
  hint.style.display = missing > 0 ? '' : 'none';
  hint.textContent   = `${missing} ${missing===1?'person has':'people have'} no location yet`;

  located.forEach(p => {
    const col   = personColor(p.id);
    const photo = p.photoId ? S.photos[p.photoId] : null;
    const init  = ((p.firstName||'')[0]+(p.lastName||'')[0]).toUpperCase();

    const inner = photo
      ? `<img src="${photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>`
      : `<span style="color:#fff;font-weight:700;font-size:16px;font-family:system-ui">${eh(init)}</span>`;

    const pin = `<div style="width:48px;height:48px;border-radius:50%;background:${photo?'#1e2130':col};
      border:3px solid ${col};display:flex;align-items:center;justify-content:center;
      overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer">${inner}</div>`;

    const marker = L.marker([p.lat, p.lng], {
      icon: L.divIcon({ html:pin, className:'', iconSize:[48,48], iconAnchor:[24,24], popupAnchor:[0,-28] })
    })
    .bindPopup(`<div style="text-align:center">
      <strong>${eh(p.firstName)} ${eh(p.lastName)}</strong>
      ${p.location  ? `<br/><small>📍 ${eh(p.location)}</small>`  : ''}
      ${p.occupation? `<br/><small>💼 ${eh(p.occupation)}</small>`: ''}
    </div>`)
    .addTo(leafMap)
    .on('click', () => modalOpen({ personId:p.id, mode:'view' }));

    leafMarkers.push(marker);
  });

  if (located.length)
    leafMap.fitBounds(L.latLngBounds(located.map(p=>[p.lat,p.lng])), { padding:[60,60], maxZoom:10 });

  setTimeout(() => leafMap.invalidateSize(), 80);
}

function personPickerOpen(contextId, relType, subKey) {
  S.personpick = { contextId, relType, subKey, search: '' };
  const ctx     = S.data.people[contextId];
  const ctxName = eh([ctx?.firstName,ctx?.lastName].filter(Boolean).join(' ') || 'person');
  const sub     = subKey ? REL_SUB[subKey] : null;
  const relIcon  = sub ? sub.icon  : REL_ICONS[relType];
  const relLabel = sub ? sub.label : REL_LABELS[relType];
  document.getElementById('person-picker-overlay')?.remove();
  document.body.insertAdjacentHTML('beforeend', `
    <div id="person-picker-overlay" onclick="if(event.target.id==='person-picker-overlay')personPickerClose()">
      <div class="person-picker-sheet" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="picker-header">
          <div class="picker-title">Link as ${relIcon} <strong>${relLabel}</strong> of <strong>${ctxName}</strong></div>
          <input class="field picker-search" placeholder="🔍 Search by name…"
                 oninput="personPickerSearch(this.value)" autocomplete="off" autocorrect="off"/>
        </div>
        <div id="picker-list"></div>
      </div>
    </div>`);
  personPickerUpdateList();
}

function personPickerClose()        { document.getElementById('person-picker-overlay')?.remove(); S.personpick = null; }
function personPickerSearch(term)   { if (!S.personpick) return; S.personpick.search = term; personPickerUpdateList(); }

function personPickerUpdateList() {
  const { contextId, relType, search } = S.personpick;
  const listEl = document.getElementById('picker-list');
  if (!listEl) return;
  const eligible = getEligiblePeople(contextId, relType);
  const term     = search.trim().toLowerCase();
  const filtered = term
    ? eligible.filter(p => [p.firstName,p.lastName,p.location,p.occupation]
        .some(f => f?.toLowerCase().includes(term)))
    : eligible;
  if (!filtered.length) {
    listEl.innerHTML = `<div class="picker-empty">${term ? 'No matches' : 'No eligible people to link'}</div>`;
    return;
  }
  const sorted = [...filtered].sort((a,b) => (a.firstName||'').localeCompare(b.firstName||''));
  listEl.innerHTML = sorted.map(p => {
    const col   = personColor(p.id);
    const photo = p.photoId ? S.photos[p.photoId] : null;
    const init  = ((p.firstName||'')[0]+(p.lastName||'')[0]).toUpperCase() || '?';
    const name  = [p.firstName,p.lastName].filter(Boolean).join(' ') || 'Unnamed';
    const sub   = [p.occupation,p.location].filter(Boolean).join(' · ');
    const avStyle = photo
      ? `background:#1e2130;background-image:url('${photo}');background-size:cover;background-position:center`
      : `background:${col}`;
    return `
      <button class="picker-item" onclick="personPickerSelect('${p.id}')">
        <div class="picker-item-avatar" style="${avStyle}">
          ${!photo ? `<span>${eh(init)}</span>` : ''}
        </div>
        <div class="picker-item-info">
          <div class="picker-item-name">${eh(name)}</div>
          ${sub ? `<div class="picker-item-sub">${eh(sub)}</div>` : ''}
        </div>
        <span class="picker-item-arrow">›</span>
      </button>`;
  }).join('');
}

function personPickerSelect(targetId) {
  const { contextId, relType } = S.personpick;
  personPickerClose();
  linkExisting(contextId, relType, targetId);
}

/* ═══════════════════════════════════════════════════════════════
   MODAL
═══════════════════════════════════════════════════════════════ */
function modalOpen(cfg) {
  const p = cfg.personId ? S.data.people[cfg.personId] : null;
  const defGender = cfg.subKey ? (REL_SUB[cfg.subKey]?.gender || '') : '';
  S.modal = {
    personId:    cfg.personId  || null,
    contextId:   cfg.contextId || null,
    relType:     cfg.relType   || 'child',
    subKey:      cfg.subKey    || null,
    initMode:    cfg.mode,
    mode:        cfg.mode,
    form: p ? {
      firstName:  p.firstName  || '',
      lastName:   p.lastName   || '',
      gender:     p.gender     || '',
      location:   p.location   || '',
      occupation: p.occupation || '',
      phone:      p.phone      || '',
      photoId:    p.photoId    || null,
    } : { firstName:'', lastName:'', gender:defGender, location:'', occupation:'', phone:'', photoId:null },
    preview:     (p?.photoId && S.photos[p.photoId]) || null,
    pendingFile: null,
    doRemove:    false,
    saving:      false,
  };
  modalRender();
}

function modalClose() {
  document.getElementById('modal-overlay')?.remove();
  S.modal = null;
}

function modalRender() {
  document.getElementById('modal-overlay')?.remove();
  if (!S.modal) return;

  const { mode, form, preview, saving, initMode, personId, contextId, relType, subKey } = S.modal;
  const isEdit  = mode==='edit' || initMode==='add';
  const isAdd   = initMode==='add';
  const isRoot  = personId === S.data.rootId;
  const p       = personId ? S.data.people[personId] : null;
  const dispName= [form.firstName, form.lastName].filter(Boolean).join(' ') || 'Unnamed';

  const photoSec = `
    <div class="photo-sec">
      <div class="avatar" id="modal-avatar"
           style="${preview ? `background-image:url('${preview}')` : ''}"
           ${isEdit ? `onclick="document.getElementById('photo-file-input').click()"` : ''}>
        ${!preview ? `<span class="avatar-initials">${eh((form.firstName||'?')[0])}</span>` : ''}
        ${isEdit   ? `<div class="avatar-cam">📷</div>` : ''}
      </div>
      ${isEdit ? `
        <div class="photo-btns">
          <button class="btn-photo" onclick="document.getElementById('photo-file-input').click()">
            ${preview ? 'Change photo' : 'Add photo'}
          </button>
          ${preview ? `<button class="btn-photo-rm" onclick="mRemovePhoto()">Remove</button>` : ''}
        </div>
        <input id="photo-file-input" type="file" accept="image/*" capture="environment"
               style="display:none" onchange="mPhotoChange(this)"/>` : ''}
    </div>`;

  /* Relationship rows for view mode */
  let relRows = '';
  if (!isEdit && p) {
    const parentsArr  = (p.parents || []).map(pid => S.data.people[pid]).filter(Boolean);
    const childrenArr = (p.children || []).map(cid => S.data.people[cid]).filter(Boolean);
    const spouse      = p.spouseId ? S.data.people[p.spouseId] : null;
    const siblingIds  = new Set(
      parentsArr.flatMap(par => (par.children || []).filter(c => c !== p.id))
    );
    (S.data.links || []).forEach(lk => {
      if (lk.type !== 'sibling') return;
      if (lk.a === p.id) siblingIds.add(lk.b);
      if (lk.b === p.id) siblingIds.add(lk.a);
    });
    const siblingsArr = [...siblingIds].map(sid => S.data.people[sid]).filter(Boolean);

    const gLabel = (g, m, f, n) => g==='male'?m : g==='female'?f : n;
    const relParts = [];
    if (spouse) {
      const sName  = [spouse.firstName, spouse.lastName].filter(Boolean).join(' ') || 'Unnamed';
      const spLbl  = gLabel(spouse.gender, 'Husband', 'Wife', 'Spouse / Partner');
      const spIcon = gLabel(spouse.gender, '🤵', '👰', '♥');
      relParts.push(`<div class="view-row" style="border-left:3px solid ${RC.spouse};padding-left:10px">
        <span class="row-icon">${spIcon}</span>
        <span>${spLbl}:&nbsp;<button class="person-link" onclick="modalClose();modalOpen({personId:'${spouse.id}',mode:'view'})">${eh(sName)}</button>
        </span></div>`);
    }
    parentsArr.forEach(par => {
      const pName  = [par.firstName, par.lastName].filter(Boolean).join(' ') || 'Unnamed';
      const pLbl   = gLabel(par.gender, 'Father', 'Mother', 'Parent');
      const pIcon  = gLabel(par.gender, '👨', '👩', '👆');
      relParts.push(`<div class="view-row" style="border-left:3px solid ${RC.parent};padding-left:10px">
        <span class="row-icon">${pIcon}</span>
        <span>${pLbl}:&nbsp;<button class="person-link" onclick="modalClose();modalOpen({personId:'${par.id}',mode:'view'})">${eh(pName)}</button>
        </span></div>`);
    });
    /* Grandparents */
    const grandparentsArr = parentsArr.flatMap(par =>
      (par.parents || []).map(gpid => S.data.people[gpid]).filter(Boolean)
    );
    const seenGp = new Set();
    const uniqueGp = grandparentsArr.filter(gp => { if (seenGp.has(gp.id)) return false; seenGp.add(gp.id); return true; });
    if (uniqueGp.length) {
      relParts.push(`<div class="ancestor-section">Grandparents</div>`);
      uniqueGp.forEach(gp => {
        const gpName = [gp.firstName, gp.lastName].filter(Boolean).join(' ') || 'Unnamed';
        const gpLbl  = gLabel(gp.gender, 'Grandfather', 'Grandmother', 'Grandparent');
        const gpIcon = gLabel(gp.gender, '👴', '👵', '👴');
        relParts.push(`<div class="view-row" style="border-left:3px solid ${RC.parent};padding-left:10px;opacity:.85">
          <span class="row-icon">${gpIcon}</span>
          <span>${gpLbl}:&nbsp;<button class="person-link" onclick="modalClose();modalOpen({personId:'${gp.id}',mode:'view'})">${eh(gpName)}</button>
          </span></div>`);
      });
    }
    /* Great-grandparents */
    const greatGpArr = uniqueGp.flatMap(gp =>
      (gp.parents || []).map(ggpid => S.data.people[ggpid]).filter(Boolean)
    );
    const seenGgp = new Set();
    const uniqueGgp = greatGpArr.filter(ggp => { if (seenGgp.has(ggp.id)) return false; seenGgp.add(ggp.id); return true; });
    if (uniqueGgp.length) {
      relParts.push(`<div class="ancestor-section">Great-Grandparents</div>`);
      uniqueGgp.forEach(ggp => {
        const ggpName = [ggp.firstName, ggp.lastName].filter(Boolean).join(' ') || 'Unnamed';
        const ggpLbl  = gLabel(ggp.gender, 'Great-Grandfather', 'Great-Grandmother', 'Great-Grandparent');
        const ggpIcon = gLabel(ggp.gender, '👴', '👵', '👴');
        relParts.push(`<div class="view-row" style="border-left:3px solid ${RC.parent};padding-left:10px;opacity:.7">
          <span class="row-icon">${ggpIcon}</span>
          <span>${ggpLbl}:&nbsp;<button class="person-link" onclick="modalClose();modalOpen({personId:'${ggp.id}',mode:'view'})">${eh(ggpName)}</button>
          </span></div>`);
      });
    }
    siblingsArr.forEach(s => {
      const sn    = [s.firstName, s.lastName].filter(Boolean).join(' ') || 'Unnamed';
      const sLbl  = gLabel(s.gender, 'Brother', 'Sister', 'Sibling');
      const sIcon = gLabel(s.gender, '👦', '👧', '👫');
      relParts.push(`<div class="view-row" style="border-left:3px solid ${RC.sibling};padding-left:10px">
        <span class="row-icon">${sIcon}</span>
        <span>${sLbl}:&nbsp;<button class="person-link" onclick="modalClose();modalOpen({personId:'${s.id}',mode:'view'})">${eh(sn)}</button>
        </span></div>`);
    });
    childrenArr.forEach(c => {
      const cn    = [c.firstName, c.lastName].filter(Boolean).join(' ') || 'Unnamed';
      const cLbl  = gLabel(c.gender, 'Son', 'Daughter', 'Child');
      const cIcon = gLabel(c.gender, '👦', '👧', '👶');
      relParts.push(`<div class="view-row" style="border-left:3px solid ${RC.child};padding-left:10px">
        <span class="row-icon">${cIcon}</span>
        <span>${cLbl}:&nbsp;<button class="person-link" onclick="modalClose();modalOpen({personId:'${c.id}',mode:'view'})">${eh(cn)}</button>
        </span></div>`);
    });
    if (relParts.length) relRows = `<div class="rel-section-title">Family</div>${relParts.join('')}<div class="section-sep"></div>`;
  }

  let addCtx = '';
  if (isAdd && contextId) {
    const ctx      = S.data.people[contextId];
    const ctxName  = [ctx?.firstName,ctx?.lastName].filter(Boolean).join(' ') || 'person';
    const sub      = subKey ? REL_SUB[subKey] : null;
    const addLabel = sub ? sub.label : capitalize(REL_LABELS[relType]);
    const addIcon  = sub ? sub.icon  : REL_ICONS[relType];
    addCtx = `<div class="add-ctx">Adding <strong>${addIcon} ${addLabel}</strong> for ${eh(ctxName)}</div>`;
  }

  const body = isEdit ? `
    <div class="modal-body">
      ${addCtx}
      <div class="form-stack">
        <div class="form-pair">
          <input class="field" placeholder="First name"
                 value="${ea(form.firstName)}" oninput="S.modal.form.firstName=this.value"/>
          <input class="field" placeholder="Last name"
                 value="${ea(form.lastName)}"  oninput="S.modal.form.lastName=this.value"/>
        </div>
        <div style="display:flex;gap:6px">
          <button type="button" class="gender-btn${form.gender==='male'?' gender-male':''}" onclick="mSetGender('male')">♂ Male</button>
          <button type="button" class="gender-btn${form.gender==='female'?' gender-female':''}" onclick="mSetGender('female')">♀ Female</button>
          <button type="button" class="gender-btn${form.gender==='nonbinary'?' gender-nonbinary':''}" onclick="mSetGender('nonbinary')">⚧ Other</button>
        </div>
        <input class="field" placeholder="📍 Location (e.g. Lagos, Nigeria)"
               value="${ea(form.location)}"   oninput="S.modal.form.location=this.value"/>
        <input class="field" placeholder="💼 Occupation / what they do today"
               value="${ea(form.occupation)}" oninput="S.modal.form.occupation=this.value"/>
        <input class="field" type="tel" placeholder="📞 Phone number"
               value="${ea(form.phone)}"      oninput="S.modal.form.phone=this.value"/>
      </div>
    </div>` : `
    <div class="modal-body">
      <h2 class="view-name">${eh(dispName)}</h2>
      ${relRows}
      ${form.gender ? `<div class="view-row"><span class="row-icon">${{male:'♂',female:'♀',nonbinary:'⚧'}[form.gender]}</span><span style="color:${{male:'#93c5fd',female:'#f9a8d4',nonbinary:'#d8b4fe'}[form.gender]}">${{male:'Male',female:'Female',nonbinary:'Non-binary / Other'}[form.gender]}</span></div>` : ''}
      ${form.location   ? `<div class="view-row"><span class="row-icon">📍</span><span>${eh(form.location)}</span></div>` : ''}
      ${form.occupation ? `<div class="view-row"><span class="row-icon">💼</span><span>${eh(form.occupation)}</span></div>` : ''}
      ${form.phone      ? `<div class="view-row"><span class="row-icon">📞</span>
          <a class="phone-link" href="tel:${ea(form.phone)}">${eh(form.phone)}</a></div>` : ''}
      ${!relRows && !form.gender && !form.location && !form.occupation && !form.phone
        ? `<p class="no-details">No details yet — tap Edit to add some.</p>` : ''}
    </div>`;

  const actions = isEdit ? `
    <div class="modal-actions">
      <button class="btn-cancel" onclick="mCancel()" ${saving?'disabled':''}>Cancel</button>
      <button class="btn-save"   onclick="mSave()"   ${saving?'disabled':''}>
        ${saving ? 'Saving…' : 'Save'}
      </button>
    </div>` : `
    <div class="modal-actions">
      ${!isRoot ? `<button class="btn-del" onclick="mDelete()">Delete</button>` : ''}
      <button class="btn-edit" onclick="mEdit()">Edit</button>
    </div>`;

  document.body.insertAdjacentHTML('beforeend', `
    <div id="modal-overlay" onclick="if(event.target.id==='modal-overlay')modalClose()">
      <div class="modal-sheet" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        ${photoSec}${body}${actions}
      </div>
    </div>`);
}

/* ── Modal actions ── */
function mEdit()   { S.modal.mode='edit'; modalRender(); }
function mCancel() { if (S.modal.initMode==='add') modalClose(); else { S.modal.mode='view'; modalRender(); } }

function mPhotoChange(input) {
  const file = input.files?.[0]; if (!file) return;
  S.modal.pendingFile = file;
  S.modal.doRemove    = false;
  const fr = new FileReader();
  fr.onload = e => { S.modal.preview = e.target.result; modalRender(); };
  fr.readAsDataURL(file);
}

function mRemovePhoto() {
  S.modal.pendingFile = null;
  S.modal.preview     = null;
  S.modal.doRemove    = true;
  modalRender();
}

function mSetGender(g) {
  if (!S.modal) return;
  S.modal.form.gender = S.modal.form.gender === g ? '' : g; // tap same = clear
  modalRender();
}

async function mSave() {
  if (S.modal.saving) return;
  S.modal.saving = true;
  modalRender();
  try {
    const { form, personId, contextId, relType, initMode, doRemove, pendingFile } = S.modal;
    let photoId = form.photoId;
    if (doRemove && photoId) {
      await photoDelete(photoId); delete S.photos[photoId]; photoId = null;
    } else if (pendingFile) {
      if (photoId) { await photoDelete(photoId); delete S.photos[photoId]; }
      const dataUrl = await photoCompress(pendingFile);
      if (dataUrl) { photoId = uid(); S.photos[photoId] = dataUrl; await photoStore(photoId, dataUrl); }
    }
    const prevPerson = personId ? S.data.people[personId] : null;
    const updates    = { ...form, photoId };
    if (updates.location && updates.location !== prevPerson?.location) {
      const coords = await geocode(updates.location);
      updates.lat = coords?.lat ?? null;
      updates.lng = coords?.lng ?? null;
    } else if (!updates.location) {
      updates.lat = null; updates.lng = null;
    } else {
      updates.lat = prevPerson?.lat ?? null;
      updates.lng = prevPerson?.lng ?? null;
    }
    const isNew = initMode === 'add';
    if (isNew) personAddRel(contextId, relType, updates);
    else       personUpdate(personId, updates);
    dataSave(); treeRender(); headerUpdate(); modalClose();
    if (isNew) treeFit();
  } catch (err) {
    console.error(err);
    S.modal.saving = false;
    modalRender();
  }
}

async function mDelete() {
  const { personId } = S.modal;
  const p    = S.data.people[personId];
  const name = [p?.firstName, p?.lastName].filter(Boolean).join(' ') || 'this person';
  const desc = (p?.children||[]).length;
  const msg  = desc > 0
    ? `Delete "${name}" and all their descendants? This cannot be undone.`
    : `Delete "${name}"?`;
  if (!confirm(msg)) return;
  if (p?.photoId) { await photoDelete(p.photoId); delete S.photos[p.photoId]; }
  if (S.highlight === personId) S.highlight = null;
  personDelete(personId);
  dataSave(); treeRender(); headerUpdate(); modalClose();
}

/* ═══════════════════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════════════════ */
function headerUpdate() {
  const n = Object.values(S.data.people).length;
  document.getElementById('member-count').textContent = `${n} ${n===1?'member':'members'}`;
}

/* ═══════════════════════════════════════════════════════════════
   EXPORT / IMPORT
═══════════════════════════════════════════════════════════════ */
async function doExport() {
  const ids = Object.values(S.data.people).filter(p=>p.photoId).map(p=>p.photoId);
  const photoMap = {};
  if (ids.length) {
    const db = await dbOpen();
    await Promise.all(ids.map(id => new Promise(res => {
      const r = db.transaction(DB_STORE).objectStore(DB_STORE).get(id);
      r.onsuccess = () => { if (r.result) photoMap[id] = r.result; res(); };
      r.onerror   = () => res();
    })));
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(
    [JSON.stringify({ version:2, tree:S.data, photos:photoMap })],
    { type:'application/json' }
  ));
  a.download = `family-tree-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function doImportClick() {
  const input = document.createElement('input');
  input.type   = 'file';
  input.accept = '.json,application/json';
  input.onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      if ((!parsed.version || parsed.version < 1) || !parsed.tree) { alert('Invalid backup file.'); return; }
      if (!confirm('Import this family tree? Your current data will be replaced.')) return;
      if (parsed.photos) {
        const db = await dbOpen();
        await Promise.all(Object.entries(parsed.photos).map(([id, dataUrl]) =>
          new Promise((ok, fail) => {
            const tx = db.transaction(DB_STORE,'readwrite');
            tx.objectStore(DB_STORE).put(dataUrl, id);
            tx.oncomplete = ok; tx.onerror = fail;
          })
        ));
        S.photos = parsed.photos;
      }
      S.data = parsed.tree;
      migrateData(S.data);
      S._layoutDirty = true;
      S._pos = {};
      dataSave();
      treeRender();
      headerUpdate();
      treeFit();
    } catch { alert('Could not read the file. Make sure it is a valid Family Tree backup.'); }
  };
  input.click();
}

/* ═══════════════════════════════════════════════════════════════
   SEARCH
═══════════════════════════════════════════════════════════════ */
function searchOpen() {
  S.search = { term: '' };
  searchRender();
  requestAnimationFrame(() => document.getElementById('search-input')?.focus());
}
function searchClose() {
  S.search = null;
  document.getElementById('search-overlay')?.remove();
}
function searchQuery(term) {
  if (!S.search) return;
  S.search.term = term;
  searchUpdateList();
}
function searchRender() {
  document.getElementById('search-overlay')?.remove();
  if (!S.search) return;
  document.body.insertAdjacentHTML('beforeend', `
    <div id="search-overlay" onclick="if(event.target.id==='search-overlay')searchClose()">
      <div class="search-sheet" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="picker-header">
          <div class="picker-title">Search People</div>
          <input id="search-input" class="field picker-search" placeholder="🔍 Type a name…"
                 oninput="searchQuery(this.value)" autocomplete="off"/>
        </div>
        <div id="search-list"></div>
      </div>
    </div>`);
  searchUpdateList();
}
function searchUpdateList() {
  const list = document.getElementById('search-list');
  if (!list) return;
  const term = (S.search?.term || '').trim().toLowerCase();
  const all  = Object.values(S.data.people);
  const matches = term
    ? all.filter(p => [p.firstName, p.lastName, p.location, p.occupation]
        .filter(Boolean).some(v => v.toLowerCase().includes(term)))
    : all.slice().sort((a, b) => (a.firstName || '').localeCompare(b.firstName || ''));
  if (!matches.length) {
    list.innerHTML = `<div class="search-empty">${term ? 'No people match your search' : 'No people in tree yet'}</div>`;
    return;
  }
  const col = id => personColor(id);
  list.innerHTML = matches.map(p => {
    const name = [p.firstName, p.lastName].filter(Boolean).join(' ') || 'Unnamed';
    const sub  = [p.location, p.occupation].filter(Boolean).join(' · ') || '';
    const ini  = (p.firstName || '?')[0].toUpperCase();
    const bg   = col(p.id);
    return `<button class="picker-item" onclick="searchClose();modalOpen({personId:'${p.id}',mode:'view'})">
      <div class="picker-item-avatar" style="background:${bg}">
        <span>${eh(ini)}</span>
      </div>
      <div class="picker-item-info">
        <div class="picker-item-name">${eh(name)}</div>
        ${sub ? `<div class="picker-item-sub">${eh(sub)}</div>` : ''}
      </div>
      <div class="picker-item-arrow">›</div>
    </button>`;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════════
   TINY UTILS
═══════════════════════════════════════════════════════════════ */
function uid()        { return crypto.randomUUID(); }
function eh(s)        { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ea(s)        { return String(s||'').replace(/"/g,'&quot;'); }
function capitalize(s){ return s ? s[0].toUpperCase() + s.slice(1) : s; }
</script>
